# SQL paleidimas: vienas supabase/sql/*.sql failas paleidžiamas Supabase duomenų bazėje (tas pats SUPABASE_DB_URL,
# kaip naktinėms kopijoms). Paleidžiama tik rankiniu būdu: Actions → „SQL paleidimas“ → Run workflow → failo pavadinimas
# (pvz. mail_off.sql). Leidžiami tik repozitorijoje esantys supabase/sql failai; rezultatas – šio paleidimo žurnale.
name: SQL paleidimas

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Failas iš supabase/sql (pvz. mail_off.sql)'
        required: true

concurrency:
  group: sql-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Paleisti
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Nėra SUPABASE_DB_URL"; exit 1; }
          echo "$FILE" | grep -Eq '^[a-z0-9_]+\.sql$' || { echo "::error::Netinkamas failo pavadinimas: $FILE"; exit 1; }
          [ "$FILE" != "atnaujinimas.sql" ] || { echo "::error::atnaujinimas.sql per ilgas – paleisk konkretų failą"; exit 1; }
          [ -f "supabase/sql/$FILE" ] || { echo "::error::Nėra supabase/sql/$FILE"; exit 1; }
          docker run --rm -v "$PWD/supabase/sql:/sql:ro" -e DBURL="$SUPABASE_DB_URL" postgres:17 \
            psql "$DBURL" -v ON_ERROR_STOP=1 -X -f "/sql/$FILE"
