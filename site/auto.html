async function vidShrink(file, maxBytes, onProg, prep){

// photos made smaller (max 1600 px, JPEG); a video squeezed on the phone to fit (up to ~45 MB)
async function addFiles(files, inp){
  if(inp) inp.value = '';

    const isVid = /^video\//.test(f.type||'') || /\.(mp4|m4v|mov|webm|3gp)$/i.test(f.name||'');

}
// pictures made smaller before sending (max 1600 px, JPEG)
async function shrink(file){
  const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return await new Promise(r=>c.toBlob(r, 'image/jpeg', .84));
}
// where the problem was noticed: the phone's place (sent with the report, shown in the chat as a map link)
let LOC = null;
function drawLoc(st){
  const el = document.getElementById('rpLoc'); if(!el) return;
  el.innerHTML = LOC ? `📍 Vieta nustatyta${LOC.acc ? ' (±'+LOC.acc+' m)' : ''} · <a href="https://www.google.com/maps?q=${LOC.lat},${LOC.lng}" target="_blank" rel="noopener">žemėlapyje</a>`
    : st==='wait' ? '📍 Nustatoma vieta…' : st ? `📍 ${esc(st)} <button type="button" class="btn ghost" id="rpLocTry" style="width:auto;padding:6px 12px;margin:0 0 0 6px;">Bandyti</button>` : '';
  const t = document.getElementById('rpLocTry'); if(t) t.onclick = getLoc;
}
function getLoc(){
  if(LOC){ drawLoc(); return; }
  if(!navigator.geolocation){ drawLoc('vietos nustatyti nepavyko'); return; }
  drawLoc('wait');
  navigator.geolocation.getCurrentPosition(p=>{ LOC = { lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy||0) }; drawLoc(); },
    e=>drawLoc(e && e.code===1 ? 'vietos nustatymas neleistas' : 'vietos nustatyti nepavyko'), { enableHighAccuracy:true, timeout:20000, maximumAge:60000 });
}
async function putFile(blob, type, ext){
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(8)), x=>(x%36).toString(36)).join('');
  const path = V.channel+'/qr-'+T+'-'+Date.now().toString(36)+rnd+'.'+ext;
  const r = await fetch(SUPABASE_URL+'/storage/v1/object/chat-files/'+path, { method:'POST', headers:hdr({ 'Content-Type':type, 'x-upsert':'false' }), body:blob });
  return r.ok ? path : null;
}
// the report is already sent: its videos are made smaller and added one by one (to the report and the chat)
let VBUSY = false;
window.addEventListener('beforeunload', e=>{ if(VBUSY){ e.preventDefault(); e.returnValue = ''; } });
async function sendVideos(rid, vids){
  const card = document.querySelector('#repCard .done'); if(!card) return;
  const box = document.createElement('div'); box.className = 'vbg'; card.insertBefore(box, card.querySelector('#rpMore'));
  const more = document.getElementById('rpMore'); more.hidden = true;
  const st = vids.map(()=>({ t:'laukia eilėje', cls:'' }));
  const draw = ()=>{ box.innerHTML = vids.map((v,i)=>`<div class="vbg-row ${st[i].cls}"><span>🎬 Video ${vids.length>1 ? i+1 : ''}</span><b>${esc(st[i].t)}</b></div>`).join('')
    + (VBUSY ? '<p class="muted" style="margin:8px 0 0;font-size:13px;">Neuždaryk šio puslapio, kol video įkeliamas.</p>' : ''); };
  VBUSY = true; draw();
  for(let i=0;i<vids.length;i++){
    try{
      st[i].t = 'suspaudžiamas…'; draw();
      const prep = vids[i].prep; vids[i].prep = null;
      const sh = await vidShrink(vids[i].file, VID_MAX, pc=>{ st[i].t = 'suspaudžiamas '+pc+'%'; draw(); }, prep);
      st[i].t = 'įkeliamas…'; draw();
      const path = await putFile(sh.blob, sh.type, sh.ext);
      if(!path) throw new Error('įkelti nepavyko');
      await rpc('vehicle_public_report_media', { p_token:T, p_report:rid, p_files:[path] });
      st[i] = { t:'✓ įkeltas ir įdėtas į chatą', cls:'ok' };
    }catch(e){ st[i] = { t:'nepavyko: '+(e.message||e), cls:'bad' }; }
    URL.revokeObjectURL(vids[i].url); draw();
  }
  VBUSY = false; draw(); more.hidden = false;
}
async function send(){
  const err = m=>{ document.getElementById('rpErr').textContent = m || ''; };
  const name = V.me ? '' : document.getElementById('rpName').value.trim(), text = document.getElementById('rpText').value.trim();
  if(!V.me && (name.length < 3 || !/\s/.test(name))){ err('Įrašyk vardą ir pavardę.'); document.getElementById('rpName').focus(); return; }
  if(text.length < 3){ err('Aprašyk, kas pastebėta.'); document.getElementById('rpText').focus(); return; }
  if(BUSY){ err('Palauk, kol paruošiamas video.'); return; }
  PH.forEach(p=>{ if(p.vid && !p.prep) p.prep = vidPrep(p.file); });   // still within the tap: later the video may play with sound
  err(''); const b = document.getElementById('rpGo'); b.disabled = true; b.textContent = PH.length ? 'Siunčiami failai…' : 'Siunčiama…';
  try{
    const paths = [], pics = PH.filter(p=>!p.vid), vids = PH.filter(p=>p.vid);
    for(let i=0;i<pics.length;i++){ const p = pics[i];
      if(pics.length > 1) b.textContent = 'Siunčiama '+(i+1)+'/'+pics.length+'…';
      const path = await putFile(p.blob, p.type||'image/jpeg', p.ext||'jpg');
      if(path) paths.push(path);
    }
    b.textContent = 'Siunčiama…';
    const args = { p_token:T, p_name:name, p_text:text, p_severity:(document.querySelector('input[name="sev"]:checked')||{}).value || 'soon', p_files:paths, p_loc:LOC };
    let rid;
    try{ rid = await rpc('vehicle_public_report', args); }
    catch(e){ if(!/p_loc|function|schema cache/i.test(e.message||'')) throw e; delete args.p_loc; rid = await rpc('vehicle_public_report', args); }   // before vehicle_loc.sql
    PH = [];
    document.getElementById('repCard').innerHTML = `<div class="done"><div class="big" style="color:var(--ok)"><svg viewBox="0 0 24 24" width="52" height="52" aria-hidden="true" style="vertical-align:-4px"><path fill="currentColor" stroke="none" transform="matrix(.025 0 0 .025 0 24)" d="m421-298 283-283-46-45-237 237-120-120-45 45 165 166Zm59 218q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Z"/></svg></div><h2>Problema užregistruota</h2><p class="muted">Ačiū! Atsakingas asmuo gavo pranešimą${paths.length ? ' su nuotraukomis / video' : ''}.</p><button class="btn ghost" id="rpMore">Registruoti dar vieną</button></div>`;
    document.getElementById('rpMore').onclick = ()=>draw();
    if(vids.length && rid) sendVideos(rid, vids);
  }catch(e){ b.disabled = false; b.textContent = 'Registruoti problemą'; err('Nepavyko: '+e.message); }
}
load();
