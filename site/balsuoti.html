    for(let j = 1; j <= b.length; j++){
      let v = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
      if(i > 1 && j > 1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, pp[j-2] + 1);
      cur.push(v);
    }
    pp = prev; prev = cur;
  }
  return prev[b.length];
}
function pollWordNear(x, y){ const L = Math.max(x.length, y.length); return x===y || (x[0]===y[0] && L > 4 && pollLev(x, y) <= (L <= 8 ? 1 : 2)); }
function pollNameNear(a, b){
  if(a===b) return true;
  const wa = a.split(' '), wb = b.split(' ');
  if(!a || wa.length!==wb.length) return false;
  if(wa.every((w, k)=>pollWordNear(w, wb[k]))) return true;
  const sa = wa.slice().sort(), sb = wb.slice().sort();
  return sa.every((w, k)=>pollWordNear(w, sb[k]));
}
const PV = { token:'', d:null, off:0, t:null, poll:null, voted:false };
function pollVoterId(){
  let v = ''; try{ v = localStorage.getItem('es_poll_voter') || ''; }catch(e){}
  if(!/^[a-z0-9]{16,}$/.test(v)){ v = Array.from(crypto.getRandomValues(new Uint8Array(12)), b=>b.toString(36).padStart(2,'0')).join('').slice(0, 20); try{ localStorage.setItem('es_poll_voter', v); }catch(e){} }
  return v;
}
function pollVotedKey(){ return 'es_poll_voted_'+(PV.d && PV.d.poll ? PV.d.poll : PV.token.slice(0, 16))+'_'+(PV.d ? PV.d.round : 0); }
async function renderPollVote(token){
  PV.token = token; PV.preview = new URLSearchParams(location.search).get('perziura')==='1';
  const el = document.getElementById('guestView'); el.classList.add('poll-pubv');
  el.innerHTML = `<div class="poll-pub"><div class="poll-pub-in"><div class="poll-msg">Kraunama…</div></div></div>`;
  document.title = 'Balsavimas · Event Solutions';
  // the permanent QR: keeps asking which question runs now (the next one appears by itself);
  // started first, so a slow first answer never leaves the page waiting
  PV.poll = setInterval(()=>{ if(document.visibilityState==='visible') pollVoteLoad(); }, 3000);
  PV.t = setInterval(pollVoteTick, 250);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollVoteLoad(); });
  pollVoteLoad();
}
async function pollVoteLoad(){
  if(PV.busy && Date.now() - PV.busy < 8000) return;
  PV.busy = Date.now();
  try{ await pollVoteLoad0(); }
  catch(e){ if(!PV.d) pollVoteMsg('Nepavyko prisijungti.<small>Bandoma iš naujo…</small>'); }
  finally{ PV.busy = 0; }
}
async function pollVoteLoad0(){
  const sb = await pollSbReady(); if(!sb){ if(!PV.d) pollVoteMsg('Nepavyko prisijungti.<small>Patikrinkite internetą – bandoma iš naujo…</small>'); return; }
  let { data, error } = await pollTimeout(sb.rpc('poll_public', { p_token:PV.token }), 10000, { data:null, error:{ message:'timeout' } });
  if(error || !data){ if(!PV.d) pollVoteMsg('Nepavyko prisijungti.<small>Patikrinkite internetą – bandoma iš naujo…</small>'); return; }
  PV.off = Date.parse(data.now) - Date.now();
  pollNumOpts(data);
  // preview (from the editor): a sample question when nothing runs
  if(PV.preview && !['live','waiting'].includes(data.state)){
    PV.demoEnd = PV.demoEnd || new Date(Date.now()+5*60000).toISOString();
    data = Object.assign({}, data, { state:'live', poll:'demo', round:1, multi:false, topic:'Tema', question:'Pavyzdinė nominacija – kaip atrodo?', starts_at:new Date(Date.now()-1000).toISOString(), ends_at:PV.demoEnd,
      options:[{ id:'a', text:'Pirmas nominantas' },{ id:'b', text:'Antras nominantas' },{ id:'c', text:'Trečias nominantas' }] });
  }
  const was = PV.d; PV.d = data;
  if(!was || was.state!==data.state || was.round!==data.round || was.poll!==data.poll || was.topic!==data.topic || was.question!==data.question || was.multi!==data.multi || JSON.stringify(was.brand)!==JSON.stringify(data.brand)){ PV.voted = false; pollVoteDraw(); }
}
function pollVoteMsg(html){ const i = document.querySelector('.poll-pub-in'); if(i) i.innerHTML = (PV.logo||'')+`<div class="poll-msg pl-txt">${html}</div>`; }
async function pollVoteDraw(){
  const d = PV.d, pub = document.querySelector('.poll-pub'); if(!pub || !d) return;
  const B0 = pollPage(d.brand, 'vote'), [B, fam] = await pollLookFast(B0, ()=>{ if(PV.d===d && !(PV.picks && PV.picks.size)){ pollVoteDraw(); } });
  pub.style.cssText = pollBrandCss(B, fam);
  pub.classList.toggle('has-bg', !!B.bg); pub.classList.toggle('acc-grad', !!B.accGrad);
  PV.logo = B.logo ? `<img class="poll-logo" src="${esc(B.logo)}" alt="">` : '';
  let voted = false; try{ voted = !!localStorage.getItem(pollVotedKey()); }catch(e){}
  if(d.state==='idle'){ const i = document.querySelector('.poll-pub-in'); if(i) i.innerHTML = PV.logo ? PV.logo.replace('class="poll-logo"', 'class="poll-logo idle"') : ''; return; }
  if(d.state==='invalid') return pollVoteMsg('Ši nuoroda nebegalioja.');
  if(d.state==='ended') return pollVoteMsg('Balsavimas baigtas.<small>Ačiū, kad dalyvavote!</small>');
  if(d.state==='draft') return pollVoteMsg('Balsavimas dar neprasidėjo.<small>Palaukite – puslapis atsinaujins pats.</small>');
  if(voted && d.state==='live' && !PV.preview) return pollThanks(false);
  const i = document.querySelector('.poll-pub-in');
  PV.pick = null;
  i.innerHTML = `${PV.logo||''}${d.topic ? `<div class="poll-topic pl-txt">${esc(d.topic)}</div>` : ''}${d.question ? `<h1 class="poll-q pl-txt">${esc(d.question)}</h1>` : ''}
    <div class="poll-timer"><small class="pl-txt">${d.state==='waiting' ? 'Prasidės po' : 'Liko laiko'}</small><b class="pl-txt" id="pvClock"></b></div>
    ${d.state==='live' ? `${d.multi ? '<div class="poll-hint pl-txt">Galite pasirinkti kelis nominantus</div>' : ''}<div class="poll-opts ${d.multi ? 'multi' : ''}" role="${d.multi ? 'group' : 'radiogroup'}">${(d.options||[]).map(o=>`<button class="poll-ob" role="${d.multi ? 'checkbox' : 'radio'}" aria-checked="false" data-ov="${esc(o.id)}"><i class="poll-rad"></i><span class="pl-txt">${esc(o.text)}</span></button>`).join('')}</div>
      <button class="poll-go" id="pvGo" disabled><span class="pl-txt">Balsuoti</span></button>` : `<div class="poll-msg sm pl-txt">${d.write ? 'Vardą ir pavardę įrašyti galėsite, kai prasidės balsavimas.' : 'Nominantai atsiras, kai prasidės balsavimas.'}</div>`}`;
  PV.picks = new Set();
  if(d.mw && d.state==='live') return pollMultiDraw(i, d);
  if(d.write && d.state==='live') return pollWriteDraw(i, d);
  i.querySelectorAll('[data-ov]').forEach(b=>b.onclick = ()=>{ if(PV.sending) return;
    if(d.multi){ if(PV.picks.has(b.dataset.ov)) PV.picks.delete(b.dataset.ov); else PV.picks.add(b.dataset.ov); }
    else PV.picks = new Set([b.dataset.ov]);
    i.querySelectorAll('[data-ov]').forEach(x=>{ const on = PV.picks.has(x.dataset.ov); x.classList.toggle('picked', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
    document.getElementById('pvGo').disabled = !PV.picks.size; });
  const go = document.getElementById('pvGo'); if(go) go.onclick = ()=>{ if(PV.picks.size) pollVoteSend([...PV.picks], go); };
  pollVoteTick();
}
function pollWriteDraw(i, d){
  const n = Math.max(1, Math.min(50, +d.write_max || 1));
  i.querySelectorAll('.poll-opts, .poll-hint').forEach(x=>x.remove());
  const go = document.getElementById('pvGo');
  go.insertAdjacentHTML('beforebegin', `<div class="poll-warn pl-txt">Įrašykite <b>tikslų vardą ir pavardę</b>, kitaip balsas neužsiskaitys.${n > 1 ? `<br>Galite įrašyti iki ${n} skirtingų – spauskite „Įrašyti kitą“, o baigę – „Balsuoti“.` : ''}</div>
    <div class="poll-wr"></div>
    ${n > 1 ? '<button class="poll-more" id="pvMore" type="button"><span class="pl-txt">+ Įrašyti kitą</span><small class="pl-txt" id="pvMoreN"></small></button>' : ''}`);
  const box = i.querySelector('.poll-wr'), more = document.getElementById('pvMore');
  const field = first=>`<div class="poll-wr-row"><input type="text" maxlength="80" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Vardas Pavardė">${first ? '' : '<button type="button" class="poll-wr-x" title="Pašalinti" aria-label="Pašalinti">✕</button>'}</div>`;
  const upd = ()=>{
    const ins = [...box.querySelectorAll('input')], v = ins.map(x=>x.value.trim().replace(/\s+/g, ' ')).filter(Boolean);
    // the same (or nearly the same) name twice: marked, and not sent
    const seen = []; let dups = 0;
    ins.forEach(x=>{ const n = pollNameNorm(x.value), row = x.closest('.poll-wr-row'), dup = !!n && seen.some(m=>pollNameNear(n, m));
      x.classList.toggle('dup', dup); if(n && !dup) seen.push(n); if(dup) dups++;
      let msg = row.nextElementSibling && row.nextElementSibling.classList.contains('poll-wr-dup') ? row.nextElementSibling : null;
      if(dup && !msg){ row.insertAdjacentHTML('afterend', '<div class="poll-wr-dup">Šis vardas jau įrašytas – įrašykite kitą arba pašalinkite.</div>'); }
      if(!dup && msg) msg.remove(); });
    PV.picks = new Set(ins.filter(x=>!x.classList.contains('dup')).map(x=>x.value.trim().replace(/\s+/g, ' ')).filter(Boolean)); go.disabled = !PV.picks.size || dups > 0;
    go.querySelector('span').textContent = PV.picks.size > 1 ? `Balsuoti (${PV.picks.size})` : 'Balsuoti';
    if(more){ more.hidden = ins.length >= n; const c = document.getElementById('pvMoreN'); if(c) c.textContent = `(${ins.length} iš ${n})`; }
  };
  const add = (first, focus)=>{
    box.insertAdjacentHTML('beforeend', field(first));
    const row = box.lastElementChild, inp = row.querySelector('input'), x = row.querySelector('.poll-wr-x');
    inp.oninput = upd;
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!go.disabled) go.click(); } };
    if(x) x.onclick = ()=>{ const m = row.nextElementSibling; if(m && m.classList.contains('poll-wr-dup')) m.remove(); row.remove(); upd(); };
    if(focus) inp.focus();
    upd();
  };
  add(true, false);
  if(more) more.onclick = ()=>{ if(box.querySelectorAll('input').length >= n) return; add(false, true); };
  go.onclick = ()=>{ if(PV.picks.size) pollVoteSend([...PV.picks], go, true); };
  pollVoteTick();
}
function pollMultiDraw(i, d){
  i.querySelectorAll('.poll-opts, .poll-hint').forEach(x=>x.remove());
  const go = document.getElementById('pvGo'), topics = d.options || [];
  go.insertAdjacentHTML('beforebegin', `<div class="poll-warn pl-txt">Paspauskite temą ir įrašykite <b>tikslų nominanto vardą ir pavardę</b>, kitaip balsas neužsiskaitys. Balsuoti galėsite užpildę visas temas.</div>
    <div class="poll-mt">${topics.map((o, k)=>`<div class="poll-mt-row" data-mt="${esc(o.id)}"><button type="button" class="poll-mt-t"><span class="poll-mt-n pl-txt">${k+1}</span><span class="pl-txt">${esc(o.text)}</span><i class="poll-mt-ok">✓</i></button><input type="text" maxlength="80" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Vardas Pavardė" hidden></div>`).join('')}</div>`);
  const rows = [...i.querySelectorAll('.poll-mt-row')];
  const upd = ()=>{
    let filled = 0;
    rows.forEach(r=>{ const v = r.querySelector('input').value.trim(); r.classList.toggle('done', !!v); if(v) filled++; });
    go.disabled = !rows.length || filled < rows.length;
    go.querySelector('span').textContent = filled < rows.length ? `Balsuoti (${filled} iš ${rows.length})` : 'Balsuoti';
    PV.picks = new Set(filled ? ['typed'] : []);   // something typed: the page is not redrawn under the voter
  };
  rows.forEach((r, k)=>{
    const inp = r.querySelector('input');
    r.querySelector('.poll-mt-t').onclick = ()=>{ inp.hidden = false; r.classList.add('open'); inp.focus(); };
    inp.oninput = upd;
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); const nx = rows.slice(k+1).concat(rows.slice(0, k)).find(x=>!x.querySelector('input').value.trim()); if(nx) nx.querySelector('.poll-mt-t').click(); else if(!go.disabled) go.click(); } };
    inp.onblur = ()=>{ if(!inp.value.trim()){ inp.hidden = true; r.classList.remove('open'); } };
  });
  go.onclick = ()=>{ if(go.disabled) return; pollVoteSend(rows.map(r=>r.querySelector('input').value.trim().replace(/\s+/g, ' ')), go, 'multi', rows.map(r=>r.dataset.mt)); };
  upd(); pollVoteTick();
}
function pollVoteTick(){
  const d = PV.d; if(!d || PV.voted) return;
  const now = Date.now()+PV.off;
  if(d.state==='waiting' && now >= Date.parse(d.starts_at)){ pollVoteLoad(); return; }
  if(d.state==='live' && now >= Date.parse(d.ends_at)){ d.state = 'ended'; pollVoteDraw(); return; }
  const c = document.getElementById('pvClock'); if(c) c.textContent = pollClock((d.state==='waiting' ? Date.parse(d.starts_at) : Date.parse(d.ends_at)) - now);
}
async function pollVoteSend(opt, btn, write, topics){
  if(PV.preview){ toast('Peržiūra – balsas nesiunčiamas.'); return; }
  if(PV.sending) return; PV.sending = true;
  document.querySelectorAll('.poll-ob, .poll-go, .poll-wr input, .poll-mt input, .poll-mt-t').forEach(b=>{ b.disabled = true; }); btn.classList.add('sending');
  const opts = Array.isArray(opt) ? opt : [opt];
  if(write==='multi'){
    const { data, error } = await getSb().rpc('poll_mwrite', { p_token:PV.token, p_topics:topics, p_names:opts, p_voter:pollVoterId(), p_poll:PV.d.poll || null });
    PV.sending = false;
    if(error || data==='bad'){ document.querySelectorAll('.poll-go, .poll-mt input, .poll-mt-t').forEach(b=>{ b.disabled = false; }); btn.classList.remove('sending'); toast(error ? 'Nepavyko išsiųsti – bandykite dar kartą.'+(error.message ? ' ('+String(error.message).slice(0, 140)+')' : '') : 'Įrašykite vardą ir pavardę kiekvienoje temoje.', 6000); return; }
    if(data==='ended'){ PV.d.state = 'ended'; pollVoteDraw(); return; }
    try{ localStorage.setItem(pollVotedKey(), '1'); }catch(e){}
    return pollThanks(true);
  }
  if(write){
    const { data, error } = await getSb().rpc('poll_write', { p_token:PV.token, p_names:opts, p_voter:pollVoterId(), p_poll:PV.d.poll || null });
    PV.sending = false;
    if(error || data==='bad' || data==='limit' || data==='dup'){ document.querySelectorAll('.poll-go, .poll-wr input').forEach(b=>{ b.disabled = false; }); btn.classList.remove('sending'); toast(error ? 'Nepavyko išsiųsti – bandykite dar kartą.'+(error.message ? ' ('+String(error.message).slice(0, 140)+')' : '') : data==='limit' ? 'Per daug vardų.' : data==='dup' ? 'Tas pats vardas įrašytas kelis kartus – palikite vieną.' : 'Įrašykite vardą ir pavardę.'); return; }
    if(data==='ended'){ PV.d.state = 'ended'; pollVoteDraw(); return; }
    try{ localStorage.setItem(pollVotedKey(), '1'); }catch(e){}
    return pollThanks(true);
  }
  let { data, error } = await getSb().rpc('poll_vote_many', { p_token:PV.token, p_options:opts, p_voter:pollVoterId(), p_poll:PV.d.poll || null });
  if(error && /poll_vote_many|function/i.test(error.message||'') && opts.length===1) ({ data, error } = await getSb().rpc('poll_vote', { p_token:PV.token, p_option:opts[0], p_voter:pollVoterId(), p_poll:PV.d.poll || null }));
  PV.sending = false;
  if(error){ document.querySelectorAll('.poll-ob, .poll-go').forEach(b=>{ b.disabled = false; }); btn.classList.remove('sending'); toast('Nepavyko išsiųsti – bandykite dar kartą.'); return; }
  if(data==='ended'){ PV.d.state = 'ended'; pollVoteDraw(); return; }
  if(data==='bad'){ toast('Nepavyko – atnaujinkite puslapį.'); return; }
  try{ localStorage.setItem(pollVotedKey(), '1'); }catch(e){}
  pollThanks(true);
}
function pollThanks(fresh){
  PV.voted = true;
  // the page stays open: the next nomination appears here by itself
  pollVoteMsg(`<span class="poll-ok">✓</span>Ačiū už jūsų balsą!<small>${fresh ? '' : 'Jūs jau balsavote. '}Kita nominacija atsiras čia pati – puslapio neuždarykite.</small>`);
}
const token = new URLSearchParams(location.search).get('balsuoti');
document.getElementById('guestView').classList.remove('hidden');
if(token) renderPollVote(token); else document.getElementById('guestView').innerHTML = '<div class="poll-pub"><div class="poll-pub-in"><div class="poll-msg">Ši nuoroda nebegalioja.</div></div></div>';
</script>
