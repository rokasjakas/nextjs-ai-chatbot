# Windows and Mac apps (desktop/): builds them and uploads them to Cloudflare R2
# (or Supabase Storage) when DESK_VERSION in desktop/main.js is raised. Installed apps then
# offer "Atnaujinti" by themselves.
# Repository secrets (Settings → Secrets and variables → Actions): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_DOWNLOADS_BUCKET (Cloudflare R2, where the apps are kept) and
# SUPABASE_SERVICE_ROLE_KEY (the older place; its copies are removed once R2 has them).
name: Windows programa

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Įkelti net jei versija nepakeista'
        type: boolean
        default: false

env:
  SUPABASE_URL: https://yakmikxkcudwloxruhvx.supabase.co
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_DOWNLOADS_BUCKET: ${{ secrets.R2_DOWNLOADS_BUCKET }}

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build EventSolutions-Setup.exe
        run: ./build.sh
      - name: Upload (Cloudflare R2 or Supabase)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node publish.mjs

  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Mac apps (Apple M… and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip --arm64 --x64 && ls -la dist
      - name: Upload (Cloudflare R2 or Supabase)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          node publish.mjs dist/EventSolutions-Mac-arm64.zip EventSolutions-Mac-arm64
          node publish.mjs dist/EventSolutions-Mac-x64.zip EventSolutions-Mac-x64
