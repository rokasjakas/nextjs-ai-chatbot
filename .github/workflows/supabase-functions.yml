# Supabase Edge Functions: every function changed in supabase/functions/ is deployed by itself
# after a push (no more „npx supabase functions deploy …“ by hand). Each function's JWT check
# comes from supabase/config.toml ([functions.<name>] verify_jwt).
# Repository secret (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN – supabase.com → Account → Access Tokens → Generate new token
# SQL (supabase/sql/*.sql) is still run by hand in Supabase → SQL Editor.
name: Supabase funkcijos

on:
  push:
    branches: [claude/wizardly-cori-j2tuff]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:
    inputs:
      all:
        description: 'Įdiegti visas funkcijas (ne tik pakeistas)'
        type: boolean
        default: false

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yakmikxkcudwloxruhvx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Nėra SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Which functions
        id: which
        run: |
          all=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_' | tr '\n' ' ')
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            list="$all"
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            list="$all"
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(supabase/config.toml|\.github/workflows/supabase-functions.yml)$'; then
            list="$all"
          else
            list=$(git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
          fi
          # only folders that still exist
          out=""; for f in $list; do [ -f "supabase/functions/$f/index.ts" ] && out="$out $f"; done
          echo "list=$out" >> "$GITHUB_OUTPUT"
          echo "Diegiama:$out"
      - name: Deploy
        if: steps.which.outputs.list != ''
        run: |
          failed=""
          for f in ${{ steps.which.outputs.list }}; do
            echo "::group::$f"
            if supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api; then echo "✓ $f"; else failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Nepavyko:$failed"; exit 1; fi
