.ok{color:var(--ok);} .warn{color:var(--warn);} .bad{color:var(--bad);}

  if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){ vidDrop(prep); throw new Error('šis telefonas nemoka suspausti video – pasirink trumpesnį'); }
  const mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } });
  if(!mime){ vidDrop(prep); throw new Error('šis telefonas nemoka suspausti video'); }
  const p = prep || vidPrep(file), v = p.v;
  try{
    v.pause();
    if(v.readyState < 1) await new Promise((res, rej)=>{ v.onloadedmetadata = res; v.onerror = ()=>rej(new Error('video neatsidaro')); });
    let dur = v.duration;
    if(!isFinite(dur) || !dur){ v.currentTime = 1e7; await new Promise(r=>{ v.ontimeupdate = r; setTimeout(r, 1500); }); dur = v.duration; v.currentTime = 0; }
    if(!isFinite(dur) || !dur) dur = 60;
    let audio = null;
    if(p.src && p.ac){ try{ if(p.ac.state==='suspended') await Promise.race([p.ac.resume(), new Promise(r=>setTimeout(r, 700))]);
      if(p.ac.state==='running'){ const dst = p.ac.createMediaStreamDestination(); p.src.connect(dst); audio = dst.stream.getAudioTracks()[0] || null; } }catch(e){ audio = null; } }
    if(!audio) v.muted = true;
    let factor = 0.88;
    for(let attempt=0; attempt<3; attempt++){
      const aBits = audio ? 64000 : 0;
      const vBits = Math.max(120000, Math.floor(maxBytes*8*factor/dur) - aBits);
      const maxDim = vBits > 2500000 ? 1280 : vBits > 900000 ? 960 : vBits > 400000 ? 720 : 480;
      const k = Math.min(1, maxDim / Math.max(v.videoWidth||maxDim, v.videoHeight||maxDim));
      const c = document.createElement('canvas'); c.width = Math.max(2, Math.round((v.videoWidth||640)*k/2)*2); c.height = Math.max(2, Math.round((v.videoHeight||360)*k/2)*2);

      const stream = c.captureStream(30); if(audio) stream.addTrack(audio);
      const rec = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond:vBits, audioBitsPerSecond:aBits || undefined });
      const parts = []; rec.ondataavailable = e=>{ if(e.data && e.data.size) parts.push(e.data); };
      const done = new Promise(r=>{ rec.onstop = r; });
      v.currentTime = 0; await new Promise(r=>{ if(v.readyState >= 2 && !v.seeking) r(); else { v.onseeked = r; setTimeout(r, 800); } });
      let alive = true;
      const draw = ()=>{ if(!alive) return; try{ g.drawImage(v, 0, 0, c.width, c.height); }catch(e){} onProg && onProg(Math.min(99, Math.round(v.currentTime/dur*100)), attempt);
        if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); };
      draw(); rec.start(1000);
      try{ await v.play(); }catch(e){ v.muted = true; await v.play(); }
      await new Promise(r=>{ v.onended = r; });
      alive = false; rec.stop(); await done;
      const type = mime.split(';')[0], blob = new Blob(parts, { type });
      if(blob.size <= maxBytes && blob.size > 0) return { blob, type, ext:vidExt(type) };
      factor *= Math.min(0.8, maxBytes / blob.size * 0.9);

  } finally { vidDrop(p); }
}

const FP = { res:null, busy:false, err:'', tm:null };

async function fpGet(code){
  if(FP.busy) return; FP.busy = true; FP.err = ''; draw();
  try{
    await fpWait(4000);
    const j = await rpc('uta_vehicle_pin', { p_token:T, p_code:code || null, p_loc:PIN.loc });
    if(j && j.error) FP.err = j.error; else FP.res = j || { pins:[] };
  }catch(e){
    if(/function|schema cache|Could not find/i.test(e.message||'')) FP.res = { legacy:true };   // before uta_vehicle_pin.sql: the form as before

}
// the PIN hidden after a minute; shown again by asking again (that is written down too)
function fpTimer(){
  clearInterval(FP.tm); if(FP.hidden || !FP.res || !(FP.res.pins||[]).some(p=>p.pin)) return;
  let left = 60; FP.tm = setInterval(()=>{ left--; const l = document.getElementById('fpLeft');

}

  const fl = MODE==='fuel' ? 'Kvito nuotrauka: nufotografuok arba įkelk (iki 6)'
    : MODE==='incident' ? 'Nuotraukos ir video (nebūtina, iki 6 nuotraukų ir 3 video)'
    : 'Nuotraukos ir video (nebūtina, iki 6 nuotraukų ir 3 video): nufotografuok, nufilmuok arba įkelk – video suspaudžiamas ir įkeliamas jau užregistravus – laukti nereikia';
  app.innerHTML = head + back + (fpOn ? fpHtml() : '') + `<div class="card" id="repCard">
      <h2>${ic(m.i)} ${m.t}</h2>
      ${whoHtml}${body}
      <label>${fl}</label>
      <div class="phs" id="phs"></div>
      <div class="err" id="rpErr"></div>
      <div style="margin-top:14px;"><button class="btn" id="rpGo">${m.go}</button></div>
    </div>`;
  drawPh(); if(MODE!=='fuel') getLoc();
  document.getElementById('goBack').onclick = ()=>go('');
  if(fpOn){ fpBind(); fpTimer(); }
  document.getElementById('rpGo').onclick = send;
}
function drawPh(){
  const box = document.getElementById('phs'); if(!box) return;
  const nI = PH.filter(p=>!p.vid).length, nV = PH.filter(p=>p.vid).length;
  box.innerHTML = PH.map((p,i)=>`<div class="ph">${p.vid ? `<video src="${p.url}#t=0.1" muted playsinline preload="metadata"></video>` : `<img src="${p.url}" alt="">`}<button type="button" data-x="${i}" aria-label="Pašalinti">✕</button></div>`).join('')
    + (BUSY ? `<div class="ph busy" id="phBusy">${esc(BUSY)}</div>` : '')
    + (BUSY ? '' : (nI < 6 ? '<label class="addph"><input type="file" accept="image/*" capture="environment" hidden data-ph><span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="vertical-align:-4px"><path fill="currentColor" stroke="none" transform="matrix(.025 0 0 .025 0 24)" d="M480-267q72 0 121-49t49-121q0-73-49-121.5T480-607q-73 0-121.5 48.5T310-437q0 72 48.5 121T480-267Zm0-60q-48 0-79-31.5T370-437q0-48 31-79t79-31q47 0 78.5 31t31.5 79q0 47-31.5 78.5T480-327ZM140-120q-24 0-42-18t-18-42v-513q0-23 18-41.5t42-18.5h147l73-87h240l73 87h147q23 0 41.5 18.5T880-693v513q0 24-18.5 42T820-120H140Z"/></svg></span>Fotografuoti</label>' : '')
      + (nV < 3 && MODE!=='fuel' ? '<label class="addph"><input type="file" accept="video/*" capture="environment" hidden data-ph><span>🎬</span>Filmuoti</label>' : '')
      + '<label class="addph"><input type="file" accept="'+(MODE==='fuel' ? 'image/*' : 'image/*,video/*')+'" multiple hidden data-ph><span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="vertical-align:-4px"><path fill="currentColor" stroke="none" transform="matrix(.025 0 0 .025 0 24)" d="M180-120q-24 0-42-18t-18-42v-600q0-24 18-42t42-18h600q24 0 42 18t18 42v600q0 24-18 42t-42 18H180Zm56-157h489L578-473 446-302l-93-127-117 152Z"/></svg></span>Įkelti</label>');
  box.querySelectorAll('[data-x]').forEach(b=>b.onclick = ()=>{ const x = PH[+b.dataset.x]; URL.revokeObjectURL(x.url); if(x.prep) vidDrop(x.prep); PH.splice(+b.dataset.x, 1); drawPh(); });
  box.querySelectorAll('[data-ph]').forEach(inp=>inp.onchange = ()=>addFiles([...inp.files], inp));
}
// photos made smaller (max 1600 px, JPEG); a video squeezed on the phone to fit (up to ~45 MB)
async function addFiles(files, inp){
  if(inp) inp.value = '';
  for(const f of files){
    const isVid = /^video\//.test(f.type||'') || /\.(mp4|m4v|mov|webm|3gp)$/i.test(f.name||'');
    if(isVid){
      if(MODE==='fuel' || PH.filter(p=>p.vid).length >= 3) continue;
      PH.push({ file:f, url:URL.createObjectURL(f), vid:true });   // made smaller and sent after „Registruoti“ – no waiting here
    } else {
      if(PH.filter(p=>!p.vid).length >= 6) continue;
      try{ const blob = await shrink(f); PH.push({ blob, url:URL.createObjectURL(blob), type:'image/jpeg', ext:'jpg' }); }catch(e){}
    }
  }
  drawPh();
}
// pictures made smaller before sending (max 1600 px, JPEG)
async function shrink(file){
  const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  return await new Promise(r=>c.toBlob(r, 'image/jpeg', .84));
}
// where the problem was noticed: the phone's place (sent with the report, shown in the chat as a map link)
let LOC = null, CODE = '';
function drawLoc(st){
  const el = document.getElementById('rpLoc'); if(!el) return;
  el.innerHTML = LOC ? `📍 Vieta nustatyta${LOC.acc ? ' (±'+LOC.acc+' m)' : ''} · <a href="https://www.google.com/maps?q=${LOC.lat},${LOC.lng}" target="_blank" rel="noopener">žemėlapyje</a>`
    : st==='wait' ? '📍 Nustatoma vieta…' : st ? `📍 ${esc(st)} <button type="button" class="btn ghost" id="rpLocTry" style="width:auto;padding:6px 12px;margin:0 0 0 6px;">Bandyti</button>` : '';
  const t = document.getElementById('rpLocTry'); if(t) t.onclick = getLoc;
}
function getLoc(){
  if(LOC){ drawLoc(); return; }
  if(!navigator.geolocation){ drawLoc('vietos nustatyti nepavyko'); return; }
  drawLoc('wait');
  navigator.geolocation.getCurrentPosition(p=>{ LOC = { lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy||0) }; drawLoc(); },
    e=>drawLoc(e && e.code===1 ? 'vietos nustatymas neleistas' : 'vietos nustatyti nepavyko'), { enableHighAccuracy:true, timeout:20000, maximumAge:60000 });
}
async function putFile(blob, type, ext){
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(8)), x=>(x%36).toString(36)).join('');
  const path = V.channel+'/qr-'+T+'-'+Date.now().toString(36)+rnd+'.'+ext;
  const r = await fetch(SUPABASE_URL+'/storage/v1/object/chat-files/'+path, { method:'POST', headers:hdr({ 'Content-Type':type, 'x-upsert':'false' }), body:blob });
  return r.ok ? path : null;
}
// the report is already sent: its videos are made smaller and added one by one (to the report and the chat)
let VBUSY = false;
window.addEventListener('beforeunload', e=>{ if(VBUSY){ e.preventDefault(); e.returnValue = ''; } });
async function sendVideos(rid, vids){
  const card = document.querySelector('#repCard .done'); if(!card) return;
  const box = document.createElement('div'); box.className = 'vbg'; card.insertBefore(box, card.querySelector('#rpMore'));
  const more = document.getElementById('rpMore'); more.hidden = true;
  const st = vids.map(()=>({ t:'laukia eilėje', cls:'' }));
  const draw = ()=>{ box.innerHTML = vids.map((v,i)=>`<div class="vbg-row ${st[i].cls}"><span>🎬 Video ${vids.length>1 ? i+1 : ''}</span><b>${esc(st[i].t)}</b></div>`).join('')
    + (VBUSY ? '<p class="muted" style="margin:8px 0 0;font-size:13px;">Neuždaryk šio puslapio, kol video įkeliamas.</p>' : ''); };
  VBUSY = true; draw();
  for(let i=0;i<vids.length;i++){
    try{
      st[i].t = 'suspaudžiamas…'; draw();
      const prep = vids[i].prep; vids[i].prep = null;
      const sh = await vidShrink(vids[i].file, VID_MAX, pc=>{ st[i].t = 'suspaudžiamas '+pc+'%'; draw(); }, prep);
      st[i].t = 'įkeliamas…'; draw();
      const path = await putFile(sh.blob, sh.type, sh.ext);
      if(!path) throw new Error('įkelti nepavyko');
      await rpc('vehicle_public_report_media', { p_token:T, p_report:rid, p_files:[path] });
      st[i] = { t:'✓ įkeltas ir įdėtas į chatą', cls:'ok' };
    }catch(e){ st[i] = { t:'nepavyko: '+(e.message||e), cls:'bad' }; }
    URL.revokeObjectURL(vids[i].url); draw();
  }
  VBUSY = false; draw(); more.hidden = false;
}
async function send(){
  const err = m=>{ document.getElementById('rpErr').textContent = m || ''; }, g = id=>document.getElementById(id);
  const fail = (m, id)=>{ err(m); if(id && g(id)) g(id).focus(); };
  const mode = MODE, m = MODES[mode];
  const name = V.me ? '' : g('rpName').value.trim().replace(/\s+/g, ' '), email = V.me ? '' : g('rpEmail').value.trim().toLowerCase(), text = g('rpText').value.trim();
  if(!V.me && (name.length < 3 || !/\s/.test(name))) return fail('Įrašyk vardą ir pavardę.', 'rpName');
  if(!V.me && !EMAIL_RE.test(email)) return fail('Įrašyk el. paštą.', 'rpEmail');
  const title = mode==='incident' ? g('rpTitle').value.trim() : '';
  if(mode==='incident' && title.length < 3) return fail('Parašyk, kas nutiko.', 'rpTitle');
  if(text.length < 3) return fail(mode==='fuel' ? 'Parašyk komentarą dėl pylimo.' : mode==='incident' ? 'Aprašyk įvykį.' : 'Aprašyk, kas pastebėta.', 'rpText');
  const data = {};
  if(mode==='fuel'){
    const n = id=>{ const x = String(g(id).value).trim().replace(',', '.'); return x==='' ? null : +x; };
    data.liters = n('rpL'); data.eur = n('rpEur'); data.km = n('rpKm');
    if(data.liters!=null && !(data.liters > 0)) return fail('Neteisingas litrų kiekis.', 'rpL');
    if(data.eur!=null && !(data.eur >= 0)) return fail('Neteisinga suma.', 'rpEur');
    if(data.km!=null && !(data.km >= 0)) return fail('Neteisinga rida.', 'rpKm');
    const code = g('rpCode') ? g('rpCode').value.trim() : '';
    if(FP.res && !FP.res.legacy) CODE = FP.res.code || '';
    else if(!g('rpNoCode').checked){
      if(!/^\d{4}$/.test(code)) return fail('Įrašyk vairuotojo kodą (4 skaitmenys – jis yra renginio laiške) arba pažymėk „Neturiu kodo“.', 'rpCode');
      try{ if(!(await rpc('vehicle_log_code', { p_token:T, p_log:null, p_code:code }))) return fail('Tokio vairuotojo kodo nėra – patikrink renginio laiške.', 'rpCode'); }
      catch(e){ if(!/function|schema cache/i.test(e.message||'')) throw e; }   // before driver_codes.sql
      CODE = code;
    } else CODE = '';
  }
  if(mode==='incident'){ data.time = g('rpTime').value || null; data.comment = g('rpComment').value.trim() || null; }
  if(BUSY) return fail('Palauk, kol paruošiamas video.');
  if(!V.me) try{ localStorage.setItem(WHO_KEY, JSON.stringify({ name, email })); }catch(e){}
  PH.forEach(p=>{ if(p.vid && !p.prep) p.prep = vidPrep(p.file); });   // still within the tap: later the video may play with sound
  err(''); const b = g('rpGo'); b.disabled = true; b.textContent = PH.length ? 'Siunčiami failai…' : 'Siunčiama…';
  try{
    const paths = [], pics = PH.filter(p=>!p.vid), vids = PH.filter(p=>p.vid);
    for(let i=0;i<pics.length;i++){ const p = pics[i];
      if(pics.length > 1) b.textContent = 'Siunčiama '+(i+1)+'/'+pics.length+'…';
      const path = await putFile(p.blob, p.type||'image/jpeg', p.ext||'jpg');
      if(path) paths.push(path);
    }
    // an incident's videos: made smaller and sent before it is registered
    if(mode==='incident') for(let i=0;i<vids.length;i++){
      const no = vids.length > 1 ? (i+1)+'/'+vids.length+' ' : '';
      const prep = vids[i].prep; vids[i].prep = null;
      const sh = await vidShrink(vids[i].file, VID_MAX, pc=>{ b.textContent = 'Video '+no+'suspaudžiamas '+pc+'%'; }, prep);
      b.textContent = 'Video '+no+'įkeliamas…';
      const path = await putFile(sh.blob, sh.type, sh.ext);
      if(path) paths.push(path);
    }
    b.textContent = 'Siunčiama…';
    let rid;
    if(mode==='problem'){
      const args = { p_token:T, p_name:name, p_text:text, p_severity:(document.querySelector('input[name="sev"]:checked')||{}).value || 'soon', p_files:paths, p_loc:LOC };
      if(!V.me) args.p_email = email;
      try{ rid = await rpc('vehicle_public_report', args); }
      catch(e){ if(!/p_email|p_loc|function|schema cache/i.test(e.message||'')) throw e;   // before vehicle_fuel.sql / vehicle_loc.sql
        delete args.p_email;
        try{ rid = await rpc('vehicle_public_report', args); }
        catch(e2){ if(!/p_loc|function|schema cache/i.test(e2.message||'')) throw e2; delete args.p_loc; rid = await rpc('vehicle_public_report', args); } }
    } else {
      try{ rid = await rpc('vehicle_public_log', { p_token:T, p_kind:mode, p_name:name, p_email:email, p_title:title || null, p_text:text, p_files:paths, p_loc:mode==='incident' ? LOC : null, p_data:data }); }
      catch(e){ if(/function|schema cache/i.test(e.message||'')) throw new Error('ši galimybė dar neįjungta – pranešk įmonei'); throw e; }
      if(mode==='fuel' && CODE && rid) try{ await rpc('vehicle_log_code', { p_token:T, p_log:rid, p_code:CODE }); }catch(e){}
      // the PIN view goes to the UTA report now, with this fill (a member's – only now)
      if(mode==='fuel' && rid && FP.res && !FP.res.legacy) try{ await rpc('uta_vehicle_pin_done', { p_token:T, p_log:rid, p_loc:PIN.loc }); }catch(e){}
    }
    PH = [];
    g('repCard').innerHTML = `<div class="done"><div class="big" style="color:var(--ok)">${ic('ok', 52)}</div><h2>${m.done}</h2><p class="muted">${mode==='fuel' ? 'Ačiū! Pylimas įrašytas į automobilio istoriją'+(paths.length ? ' su kvito nuotrauka' : '')+'.' : mode==='incident' ? 'Ačiū! Įvykis įrašytas į automobilio istoriją, atsakingi gavo pranešimą.' : 'Ačiū! Atsakingas asmuo gavo pranešimą'+(paths.length ? ' su nuotraukomis / video' : '')+'.'}</p>
      <div id="rpMore"><button class="btn ghost" id="rpAgain">Registruoti dar vieną</button><button class="btn ghost" id="rpHome">Visi pasirinkimai</button></div></div>`;
    g('rpAgain').onclick = ()=>go(mode); g('rpHome').onclick = ()=>go('');
    if(mode==='problem' && vids.length && rid) sendVideos(rid, vids);
  }catch(e){ b.disabled = false; b.textContent = m.go; err('Nepavyko: '+e.message); }
}
load();
</script>
