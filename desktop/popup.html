<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Event Solutions</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1d; color: #f2f2f2; font: 13px/1.35 "Segoe UI", system-ui, sans-serif; user-select: none; }
  .pop { box-sizing: border-box; height: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 14px 34px 12px 14px; border: 1px solid #3a3a3e; border-left: 4px solid #F35E7D; cursor: pointer; }
  .pop:hover { background: #232326; }
  img { width: 40px; height: 40px; border-radius: 9px; flex: none; }
  .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b { margin-top: 3px; color: #c9c9ce; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .a { font-size: 11px; color: #8d8d94; margin-top: 4px; }
  .txt { min-width: 0; flex: 1; }
  .x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #9a9aa0; font-size: 16px; line-height: 24px; cursor: pointer; }
  .x:hover { background: #3a3a3e; color: #fff; }
  .call .pop { border-left-color: #2E8C77; animation: ring 1s ease-in-out infinite; }
  @keyframes ring { 50% { background: #22302c; } }
</style>
</head>
<body>
<div class="pop" id="pop">
  <img src="icons/icon.png" alt="">
  <div class="txt"><div class="t" id="t"></div><div class="b" id="b"></div><div class="a">Event Solutions</div></div>
</div>
<button class="x" id="x" title="Uždaryti">✕</button>
<script>
  const q = new URLSearchParams(location.search), call = !!q.get('call');
  document.getElementById('t').textContent = q.get('t') || 'Event Solutions';
  document.getElementById('b').textContent = q.get('b') || (call ? 'Spausk, kad atsilieptum' : '');
  if (call) document.body.classList.add('call');
  document.getElementById('pop').onclick = () => window.pop.send('open');
  document.getElementById('x').onclick = (e) => { e.stopPropagation(); window.pop.send('close'); };
  document.body.onmouseenter = () => window.pop.send('hover');
  document.body.onmouseleave = () => window.pop.send('leave');

  // sound: a short two-note chime; a call rings every 2 s
  if (q.get('sound')) {
    const ctx = new AudioContext();
    const tone = (f, at, len, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + len);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + len + 0.05);
    };
    const chime = () => { tone(880, 0, 0.35, 0.35); tone(1318.5, 0.13, 0.5, 0.3); };
    const ring = () => { for (let i = 0; i < 4; i++) { tone(784, i * 0.22, 0.18, 0.4); tone(1046.5, i * 0.22 + 0.09, 0.18, 0.35); } };
    const go = () => (call ? ring() : chime());
    ctx.resume().then(go, go);
    if (call) setInterval(ring, 2000);
  }
</script>
</body>
</html>
