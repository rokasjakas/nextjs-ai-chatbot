<title>Sąskaitos · Event Solutions</title>

<style>
:root{--bg:#141414;--panel:#1f1f1f;--border:#343434;--text:#ececec;--dim:#9a9a9a;--accent:#6BB4F5;--ok:#2F9E73;--warn:#E0A030;--bad:#E5484D;color-scheme:dark;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){--bg:#f3f4f6;--panel:#fff;--border:#dcdfe4;--text:#1d2229;--dim:#6b7280;--accent:#1e6fd9;color-scheme:light;} }
:root[data-theme="light"]{--bg:#f3f4f6;--panel:#fff;--border:#dcdfe4;--text:#1d2229;--dim:#6b7280;--accent:#1e6fd9;color-scheme:light;}
:root[data-theme="dark"]{--bg:#141414;--panel:#1f1f1f;--border:#343434;--text:#ececec;--dim:#9a9a9a;--accent:#6BB4F5;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:1240px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));}
.wrap.narrow{max-width:520px;}
.theme{white-space:nowrap;flex:none;background:none;border:1px solid var(--border);border-radius:999px;color:var(--text);font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;}
.fgrid{display:grid;grid-template-columns:1fr;gap:0;}
.fgrid > .c1{grid-area:a;} .fgrid > .c2{grid-area:b;} .fgrid > .c3{grid-area:c;} .fgrid > .c4{grid-area:s;}
.fgrid{grid-template-areas:"a" "s" "b" "c";}
@media (min-width:1360px){
  .wrap{max-width:1560px;}
  .fgrid{grid-template-columns:minmax(360px,1fr) minmax(0,1.3fr) 360px !important;grid-template-areas:"a b s" "a c s" !important;grid-template-rows:auto 1fr !important;}
  .fgrid > .c4{position:sticky;top:12px;align-self:start;}
}
@media (min-width:980px){
  .wrap{padding-left:28px;padding-right:28px;}
  .fgrid{grid-template-columns:minmax(380px,1fr) minmax(0,1.35fr);grid-template-areas:"a b" "s b" "s c";grid-template-rows:auto auto 1fr;column-gap:16px;align-items:start;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;} .home-grid > .card{margin-bottom:0;}
}
.brand{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;margin-bottom:12px;}
.brand img{width:28px;height:28px;border-radius:7px;}
.brand .sp{flex:1;}
.brand a{color:var(--accent);text-decoration:none;cursor:pointer;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
h1{font-size:22px;margin:0 0 6px;line-height:1.2;}
h2{font-size:16px;margin:0 0 10px;}
p{margin:6px 0;}
.muted{color:var(--dim);font-size:14px;}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px;}
textarea{min-height:70px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent);}
.pin{font-size:26px;letter-spacing:8px;text-align:center;font-weight:700;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:#0c1b2a;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px;}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text);font-weight:600;}
.btn.small{width:auto;padding:9px 14px;font-size:14px;margin-top:0;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.err{color:var(--bad);font-size:14px;margin-top:10px;white-space:pre-line;}
.cs-chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--text);margin:12px 0 4px;cursor:pointer;}
.cs-chk input{flex:none;width:18px;height:18px;margin:1px 0 0;}
.cs-chk a{font-weight:600;white-space:nowrap;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row2 label{margin-top:10px;}
.line{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:color-mix(in srgb,var(--bg) 45%,var(--panel));}
.line-h{display:flex;align-items:center;gap:8px;font-weight:700;}
.line-h .sp{flex:1;}
.line-h .amt{font-variant-numeric:tabular-nums;}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--dim);font-size:16px;cursor:pointer;line-height:1;}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px;}
.seg button{flex:1;padding:10px 6px;border:0;background:none;color:var(--text);font:inherit;font-size:14px;cursor:pointer;}
.seg button.on{background:var(--accent);color:#0c1b2a;font-weight:700;}
.hint{font-size:13px;color:var(--warn);margin-top:6px;}
.seg.mode{margin:4px 0 12px;} .seg.mode button{flex:1;}
.calc{margin-top:14px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;} .calc > summary{cursor:pointer;font-weight:700;}
.calc .rates{margin-top:8px;} .calc .rates > summary{cursor:pointer;font-size:13px;color:var(--accent);}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;} @media (max-width:520px){ .row3{grid-template-columns:1fr 1fr;} }
.calc-r{margin-top:10px;border-top:1px solid var(--border);padding-top:6px;}
.calc-r .sum span small{font-size:11.5px;color:var(--dim);font-weight:400;} .calc-r .cv{display:flex;align-items:baseline;gap:8px;color:var(--text);} .calc-r .cv small{color:var(--dim);font-size:12px;}
.c4 .row2{grid-template-columns:1fr;} .c4 .row2 label{margin-top:8px;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);} .chk input{width:18px;height:18px;margin:0;}
.works{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
.works-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;} .works-h .muted{font-size:13px;}
.work{display:grid;grid-template-columns:22px 128px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--border);cursor:pointer;font-size:14px;}
.work input{width:18px;height:18px;margin:0;} .work small{display:block;color:var(--dim);font-size:12px;} .work .w-s{font-weight:700;white-space:nowrap;} .work.on{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;}
.wline{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));} .wtag{font-size:13px;font-weight:700;}
@media (max-width:520px){ .work{grid-template-columns:22px 1fr auto;} .work .w-d{display:none;} }
.sum{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
.sum:last-child{border-bottom:0;}
.sum span{color:var(--dim);}
.match{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;}
.match.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);}
.match.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
.file{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--border);border-radius:10px;cursor:pointer;margin-top:4px;}
.file b{word-break:break-all;}
.file input{display:none;}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;} .top h1{flex:1;margin:0;}
.inv{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.inv-h{display:flex;align-items:flex-start;gap:10px;} .inv-h .sp{flex:1;min-width:0;} .inv-h b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.inv small{display:block;color:var(--dim);font-size:13px;}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-top:6px;}
.why{margin-top:8px;padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--bad) 13%,transparent);font-size:14px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.hist{margin-top:10px;font-size:14px;} .hist summary{cursor:pointer;color:var(--accent);font-size:14px;}
.hist ol{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--border);}
.hist li{position:relative;padding:3px 0 7px 10px;} .hist li::before{content:'';position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--c);}
.hist li small{display:inline;margin-right:6px;} .hist li em{display:block;font-style:normal;color:var(--dim);font-size:13px;}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0;}
.ftot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;padding:12px 14px;border-radius:12px;font-size:14px;}
.ftot b{font-size:22px;font-variant-numeric:tabular-nums;margin-left:auto;} .ftot small{width:100%;font-size:13px;}
.ftot.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);} .ftot.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);}
.ftot.wait,.match.wait{background:color-mix(in srgb,var(--dim) 12%,transparent);color:var(--dim);}
.extras .extra{border-left:3px solid var(--warn);padding:2px 0 6px 10px;margin-top:10px;}
.extras .extra .line-h{font-weight:600;font-size:14px;color:var(--warn);}
.file.small{padding:9px 10px;font-size:14px;margin-top:8px;}
.x-add{margin-top:10px;display:inline-block;}
.done{text-align:center;padding:26px 16px;}
.done .big{font-size:48px;}
</style>

<body>
<div class="wrap">
  <div class="brand"><img src="icons/icon-192.png" alt=""><span>Event Solutions · Freelance sąskaitos</span><span class="sp"></span><button type="button" class="theme" id="theme" title="Šviesi / tamsi tema"></button><a id="out" hidden>Atsijungti</a></div>
  <div id="app"></div>
</div>
<script>
const FN = "https://yakmikxkcudwloxruhvx.supabase.co/functions/v1/freelance-portal";
const KEY = "sb_publishable_OYVSooEWr-aPd__NPM8G3g_MQrSAXbI";
const $app = document.getElementById('app');
const esc = s=>String(s==null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); }catch(e){} } };
const keep = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
// amounts: a comma or a dot, kept in cents so 0.1+0.2 adds up
const num = v=>{ const n = parseFloat(String(v==null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const cents = n=>Math.round(n*100);
const eur = c=>(c/100).toFixed(2).replace('.', ',')+' €';
const todayStr = ()=>new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/Vilnius' }).format(new Date());

async function call(body){
  const ac = new AbortController(), to = setTimeout(()=>ac.abort(), 60000);
  try{
    const r = await fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:KEY, Authorization:'Bearer '+KEY }, body:JSON.stringify(body), signal:ac.signal });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || d.error){
      if(/Prisijungimas baigėsi|Prisijunk iš naujo/.test(d.error||'')){ S.token = null; store.set('flTok', null); }   // the filled form stays for after signing in again
      throw new Error(d.error || ('Klaida ('+r.status+')'));
    }
    return d;
  }catch(e){ throw new Error(e.name==='AbortError' ? 'Ryšys per lėtas – pabandyk dar kartą.' : (e.message || 'Nepavyko prisijungti prie serverio.')); }
  finally{ clearTimeout(to); }
}

let S = { token:store.get('flTok'), name:store.get('flName')||'', email:store.get('flEmail')||keep.get('flEmail')||'' };
function logout(){ S.token = null; store.set('flTok', null); store.set('flName', null); draft = null; }
document.getElementById('out').onclick = ()=>{ logout(); render(); };

// a link from the e-mail „Taisyti sąskaitą“ (?edit=<id>): opened after signing in
(function(){ const e = new URLSearchParams(location.search).get('edit'); if(e){ store.set('flEdit', e); history.replaceState(null, '', location.pathname); } })();
// the theme: the device's, or chosen here (kept on this device)
function themeSet(t){ const r = document.documentElement; if(t==='light' || t==='dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  const b = document.getElementById('theme'); if(b){ const cur = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); b.textContent = cur==='light' ? '🌙 Tamsi' : '☀ Šviesi'; } }
themeSet(keep.get('flTheme') || '');
document.getElementById('theme').onclick = ()=>{ const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), nx = cur==='light' ? 'dark' : 'light'; keep.set('flTheme', nx); themeSet(nx); };
function render(){
  document.getElementById('out').hidden = !S.token;
  document.querySelector('.wrap').classList.toggle('narrow', !S.token);
  if(!S.token) return S.pinSent ? viewPin() : viewEmail();
  if(draft) return viewForm();
  viewHome();
}

// ---- my invoices ----
const ST = { new:['Pateikta – laukia patvirtinimo','#E0A030'], later:['Pateikta – laukia patvirtinimo','#E0A030'], rejected:['Nepatvirtinta','#E5484D'],
  approved:['Patvirtinta, perduota buhalterijai','#2F9E73'], sent:['Patvirtinta, perduota buhalterijai','#2F9E73'], queued:['Suvesta apmokėjimui','#2F9E73'], paid:['Apmokėta','#2F9E73'] };
let LIST = null;
const HC = { info:'#6BB4F5', ok:'#2F9E73', bad:'#E5484D' };
const when = iso=>{ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('lt-LT', { timeZone:'Europe/Vilnius', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); };
async function viewHome(){
  $app.innerHTML = `<div class="card"><div class="top"><h1>Sveiki${S.name ? ', '+esc(S.name.split(' ')[0]) : ''}!</h1><button class="btn small" id="new">+ Nauja sąskaita</button></div>
      <p class="muted">Čia matai visas savo pateiktas sąskaitas. Jei sąskaita nepatvirtinta – gausi el. laišką su priežastimi ir galėsi ją pataisyti.</p></div>
    <div class="card"><h2>Mano sąskaitos</h2><div id="list"><p class="muted">Kraunama…</p></div></div>`;
  document.getElementById('new').onclick = ()=>{ draft = blankDraft(); render(); };
  try{ LIST = (await call({ action:'list', token:S.token })).invoices || []; }
  catch(x){ if(!S.token) return render(); document.getElementById('list').innerHTML = `<div class="err">${esc(/Nežinomas veiksmas/.test(x.message) ? 'Sąskaitų sąrašas dar neįjungtas serveryje (reikia atnaujinti „freelance-portal“ funkciją).' : x.message)}</div>`; return; }
  const box = document.getElementById('list'); if(!box) return;
  const want = store.get('flEdit');
  if(want){ store.set('flEdit', null); const v = LIST.find(x=>x.id===want);
    if(v && v.editable) return startEdit(v);
    if(v) setTimeout(()=>alert('Ši sąskaita jau patvirtinta – jos taisyti nebereikia.'), 50); }
  box.innerHTML = LIST.length ? LIST.map(v=>{
    const st = ST[v.status] || ST.new, L = v.lines || [];
    return `<div class="inv"><div class="inv-h"><div class="sp"><div><b>${v.number ? 'Nr. '+esc(v.number) : 'Sąskaita be nr.'}</b></div>
        <small>Pateikta ${esc(String(v.created_at||'').slice(0,10))} · ${L.length} ${L.length===1 ? 'renginys' : 'renginiai'}${L.length ? ': '+esc(L.slice(0,3).map(l=>l.event).join(', '))+(L.length>3 ? '…' : '') : ''}</small>
        <span class="st" style="--c:${st[1]}">${st[0]}</span></div><b>${eur(cents(Number(v.amount||0)))}</b></div>
      ${v.status==='rejected' && v.decision_note ? `<div class="why"><b>Priežastis:</b> ${esc(v.decision_note)}</div>` : ''}
      ${v.fix_note!=null && v.status==='new' ? `<div class="why"><b>Reikia korekcijų:</b> ${esc(v.fix_note||'žr. el. laišką')}</div>` : ''}
      ${(v.history||[]).length ? `<details class="hist"${v.status==='rejected' ? ' open' : ''}><summary>Istorija (${v.history.length})</summary><ol>${v.history.map(h=>`<li style="--c:${HC[h.c]||HC.info}"><small>${esc(when(h.at))}</small><b>${esc(h.t)}</b>${h.note ? `<em>${esc(h.note)}</em>` : ''}</li>`).join('')}</ol></details>` : ''}
      <div class="acts">${v.editable ? `<button class="btn small${v.status==='rejected' || v.fix_note!=null ? '' : ' ghost'}" data-edit="${esc(v.id)}">✏️ Taisyti sąskaitą</button>` : ''}${(v.files||[]).length ? `<button class="btn small ghost" data-file="${esc(v.id)}">📎 Failas</button>` : ''}</div></div>`;
  }).join('') : '<p class="muted">Dar nepateikei nė vienos sąskaitos.</p>';
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick = ()=>startEdit(LIST.find(v=>v.id===b.dataset.edit)));
  box.querySelectorAll('[data-file]').forEach(b=>b.onclick = async ()=>{
    const w = window.open('', '_blank');
    try{ const d = await call({ action:'file', token:S.token, id:b.dataset.file }); if(w) w.location = d.url; else location.href = d.url; }
    catch(x){ if(w) w.close(); alert(x.message); }
  });
}
function startEdit(v){
  if(!v) return;
  draft = { editId:v.id, wasRejected:v.status==='rejected' || v.fix_note!=null, fixMode:v.status!=='rejected' && v.fix_note!=null, why:(v.status==='rejected' ? v.decision_note : v.fix_note)||'', number:v.number||'', total:String(v.amount||'').replace('.', ','), note:v.note||'', file:null, oldFile:(v.files||[])[0]||null, oldTotal:v.file_total!=null ? Number(v.file_total) : null,
    lines:(v.lines||[]).map(l=>Object.assign(newLine(l.date), { work_ids:l.work_ids || (l.work_id ? [l.work_id] : []), work_id:(l.work_ids && l.work_ids.length) || l.work_id ? (l.event_id ? 'ev:'+l.event_id : 'pl:'+(l.event||'')) : '', dates:l.dates||'', ename:l.event||'', ev:l.event_id || '__manual', name:l.event_id ? '' : (l.event||''), type:l.type==='hourly' ? 'hourly' : 'fixed',
      amount:l.type==='hourly' ? '' : (Number(l.amount) ? String(l.amount).replace('.', ',') : ''), hours:l.type==='hourly' ? String(l.hours).replace('.', ',') : '', rate:l.type==='hourly' ? String(l.rate).replace('.', ',') : '',
      extras:(l.extras||[]).map(x=>({ what:x.what||'', amount:String(x.amount||'').replace('.', ','), file:null, keep:x.file_idx>0 ? x.file_idx : -1, keepName:x.file_idx>0 && v.files[x.file_idx] ? v.files[x.file_idx].name : '' })) })) };
  if(!draft.lines.length) draft.lines.push(newLine());
  render();

function workGroups(){

  return [...m.values()].map(g=>{ g.ws.sort((a, b)=>a.work_date.localeCompare(b.work_date));
    const ds = g.ws.map(w=>w.work_date), m0 = ds[0].slice(0, 8);
    g.dates = ds.length > 1 && ds.every(d=>d.slice(0, 8)===m0) ? ds[0]+(ds.length ? ', '+ds.slice(1).map(d=>+d.slice(8)).join(', ') : '') : ds.join(', ');
    g.total = g.ws.some(w=>w.total==null) ? null : Math.round(g.ws.reduce((t, w)=>t + +w.total, 0)*100)/100;
    return g; }).sort((a, b)=>a.ws[0].work_date.localeCompare(b.ws[0].work_date));

// ---- the tax calculator (an estimate by the LR rules; the rates can be changed) ----
// Individuali veikla (2026): expenses 30 % (simplified), taxable = 70 %; VSD 12,52 % (15,52 % with
// the pension accumulation) and PSD 6,98 % of 90 % of the taxable; GPM 5 % while the yearly taxable is up to 20 000 €,
// then GPM = 20 % − the credit (taxable × (0,15 − 2/300 000 × (taxable − 20 000))), 20 % from 42 500 €. A VAT payer adds 21 %.
// Verslo liudijimas / MB / UAB: no tax per invoice (a fixed fee / at the company) – only VAT if paid.
const CALC_DEF = { exp:30, base:90, vsd:12.52, psd:6.98, gpm:5, pvm:21 };
function calcState(){ if(!draft.calc) draft.calc = Object.assign({ dir:'net', amt:'', open:false, kind:'', vat:false, annual:'', pension:false }, CALC_DEF); return draft.calc; }
// GPM of a year's taxable income (individuali veikla, 2026)
function gpmYear(t){ if(t <= 0) return 0; if(t <= 20000) return t*0.05; if(t <= 42500) return t*0.20 - t*(0.15 - 2/300000*(t - 20000)); return t*0.20; }
// the GPM rate used: from the yearly income if given, else the one in the rates
function gpmRate(c){ const y = num(c.annual); if(y > 0){ const t = y * (1 - c.exp/100); return gpmYear(t) / t * 100; } return c.gpm; }
function calcKind(){ const c = calcState(); return c.kind || (draft.mode==='make' && draft.mk && draft.mk.seller && draft.mk.seller.kind) || 'iv'; }
function calcVat(){ const c = calcState(); return draft.mode==='make' && draft.mk && draft.mk.seller ? !!String(draft.mk.seller.vat||'').trim() : !!c.vat; }
// the share of the sum (without VAT) the person keeps after the taxes
function calcKeep(c, kind){ if(kind!=='iv') return { keep:1, gpm:0, vsd:0, psd:0 };
  const p = 1 - c.exp/100, b = p * c.base/100, gpm = p * gpmRate(c)/100, vsd = b * (c.vsd + (c.pension ? 3 : 0))/100;
  // PSD: with the yearly income given and not insured elsewhere – at least 965,76 € a year (80,48 €/mėn.), spread over the year's income
  const y = num(c.annual), psd = y > 0 && !c.insured ? Math.max(y * b * c.psd/100, 965.76) / y : b * c.psd/100; return { keep:1 - gpm - vsd - psd, gpm, vsd, psd }; }
function calcRun(){
  const c = calcState(), kind = calcKind(), vat = calcVat(), k = calcKeep(c, kind), a = num(c.amt);
  if(!(a > 0)) return null;
  let net, inv, noVat;
  if(c.dir==='net'){ net = a; noVat = k.keep > 0 ? a / k.keep : a; inv = vat ? noVat * (1 + c.pvm/100) : noVat; }
  else { inv = a; noVat = vat ? a / (1 + c.pvm/100) : a; net = noVat * k.keep; }
  const r = x=>Math.round(x*100)/100;
  return { kind, vat, inv:r(inv), noVat:r(noVat), pvm:r(inv - noVat), gpm:r(noVat*k.gpm), vsd:r(noVat*k.vsd), psd:r(noVat*k.psd), net:r(net) };
}
function calcHtml(){
  const c = calcState();
  return ``;
}

  box.innerHTML = `<div class="seg"><button type="button" data-cdir="net" class="${c.dir==='net' ? 'on' : ''}">Noriu gauti į rankas</button><button type="button" data-cdir="inv" class="${c.dir==='inv' ? 'on' : ''}">Turiu sąskaitos sumą</button></div>
    <div class="row2"><div><label>${c.dir==='net' ? 'Į rankas, €' : 'Sąskaitos suma, €'}</label><input id="cAmt" inputmode="decimal" value="${esc(c.amt)}" placeholder="0,00" autocomplete="off"></div>
      <div><label>Veiklos forma</label>${fromMake ? `<input value="${esc(KL[kind]||kind)}${vat ? ' · PVM mokėtojas' : ''}" disabled>` : `<select id="cKind">${Object.entries(KL).map(([k, l])=>`<option value="${k}"${kind===k ? ' selected' : ''}>${l}</option>`).join('')}</select>`}</div></div>

  const differ = draft.lines.some(l=>l.work_id && l.agreed!=null && lineCents(l)!==cents(l.agreed));
  if(differ && !String(draft.note||'').trim()) miss.push('parašyk pastaboje, kodėl suma kita nei sutarta');
  box.innerHTML = `<div class="sum"><span>Renginiai (${draft.lines.length})</span><b>${eur(sum-ex)}</b></div>${ex ? `<div class="sum"><span>Papildomos išlaidos</span><b>${eur(ex)}</b></div>` : ''}<div class="sum"><span>Iš viso</span><b>${eur(sum)}</b></div>${draft.mode==='make' ? '' : `<div class="sum"><span>Sąskaitoje (iš failo)</span><b>${ft!=null ? eur(ft) : '—'}</b></div>`}${m}${miss.length ? `<p class="muted">Dar: ${miss.join(', ')}.</p>` : ''}`;
  const send = document.getElementById('send');
  const totOk = draft.mode==='make' ? sum>0 : (tot===ft && sum===ft);
  if(send) send.disabled = !(ft!=null && !busy && totOk && bad<0 && !(differ && !String(draft.note||'').trim()));
}
function fileB64(f){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1] || ''); r.onerror = ()=>rej(new Error('Nepavyko perskaityti failo.')); r.readAsDataURL(f); });
}
async function submit(){
  const b = document.getElementById('send'), err = document.getElementById('err');
  if(b.disabled) return;
  b.disabled = true; b.textContent = 'Siunčiama…'; err.textContent = '';
  try{
    const lines = await linesOut();
    const f = draft.mode==='make' ? null : draft.file;
    const d = await call({ action:'submit', token:S.token, id:draft.editId || undefined, number:draft.number.trim(), total:num(draft.total), note:draft.note.trim(), lines,
      ...(draft.mode==='make' ? { make:makeOf() } : { file: f ? { name:f.name, type:f.type, base64:draft.b64 || await fileB64(f) } : null }) });
    submitDone(d);
  }catch(x){
    if(!S.token){ render(); return; }
    b.disabled = false; b.textContent = draft && draft.editId ? 'Siųsti pataisytą sąskaitą' : draft && draft.mode==='make' ? 'Sukurti ir siųsti sąskaitą' : 'Siųsti sąskaitą'; err.textContent = x.message;
  }
}
async function linesOut(){
    const lines = [];
    for(const l of draft.lines){
      const man = manual(l), o = { date:l.date, event_id:man ? null : l.ev, event_name:man ? l.name.trim() : '', type:l.type, extras:[], ...(l.work_ids && l.work_ids.length ? { work_ids:l.work_ids, dates:l.dates||'' } : {}) };
      if(l.type==='hourly'){ o.hours = num(l.hours); o.rate = num(l.rate); } else o.amount = num(l.amount) || 0;
      for(const x of l.extras||[]) o.extras.push({ what:x.what.trim(), amount:num(x.amount), keep:x.keep, file: x.file ? { name:x.file.name, type:x.file.type, base64:await fileB64(x.file) } : null });
      lines.push(o);
    }
    return lines;
}
function submitDone(d){
    draft = null;
    $app.innerHTML = `<div class="card done"><div class="big">✅</div><h1>${d.edited ? 'Pataisyta sąskaita išsiųsta' : 'Sąskaita išsiųsta'}</h1>
      <p class="muted">Gavome jūsų sąskaitą (${eur(cents(d.total))}). Ji perduota tvirtinimui – kai bus patvirtinta, gausite el. laišką.</p>
      <button class="btn" id="again">Mano sąskaitos</button><button class="btn ghost" id="bye">Atsijungti</button></div>`;
    document.getElementById('again').onclick = ()=>render();
    document.getElementById('bye').onclick = ()=>{ logout(); render(); };
}

render();
</script>
