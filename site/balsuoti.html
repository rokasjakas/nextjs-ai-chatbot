  if(!first) body.scrollTop = y;
  WSP.fhtml = list.length ? body.innerHTML : '';
  wishFadeTop(body); wishFeedBind(body);
}
function wishFeedBind(body){
  body.querySelectorAll('[data-fw]').forEach(card=>card.addEventListener('click', async e=>{
    const b = e.target.closest('[data-emo]'); if(!b) return;
    b.disabled = true;
    const r = await getSb().rpc('wish_react', { p_token:WSP.token, p_wish:card.dataset.fw, p_emoji:b.dataset.emo, p_voter:pollVoterId() });
    if(r.error){ b.disabled = false; toast(r.error.message || 'Nepavyko.'); return; }
    card.querySelector('.poll-wre').innerHTML = wishEmoRow({ counts:r.data.counts, mine:r.data.mine });
    if(b.dataset.emo && (r.data.mine || []).includes(b.dataset.emo)){ const n = card.querySelector(`[data-emo="${b.dataset.emo}"]`); if(n){ n.classList.add('pop'); } }
    WSP.fhtml = body.innerHTML;
  }));
}
function wishEmoRow(w){
  const c = w.counts || {}, mine = w.mine || [];
  return WSH_EMO.map(([k, e])=>`<button type="button" data-emo="${k}" class="${mine.includes(k) ? 'on' : ''}">${e}${+c[k] ? `<b>${+c[k]}</b>` : ''}</button>`).join('');
}
const pollHex = (c, d)=>/^#[0-9a-f]{6}$/i.test(c||'') ? c : d;
const WS = { token:'', d:null, i:-1, at:0, key:'', seen:null, queue:[] };
async function renderWishScreen(token){
  WS.token = token;
  const el = document.getElementById('guestView'); el.classList.add('poll-resv');
  el.innerHTML = `<div class="poll-rs-wrap"><div class="poll-rs wsh-stage" id="wshStage"><div class="wsh-bgimg" id="wshBgImg"></div><div class="wsh-logo" id="wshLogo"></div><div class="wsh-card" id="wshCard"></div></div></div>`;
  document.title = 'Linkėjimai · Event Solutions';
  window.addEventListener('resize', wishFit);
  const load = async ()=>{
    const { data, error } = await getSb().rpc('wish_screen', { p_token:token });
    if(error || !data){ document.getElementById('wshCard').innerHTML = '<div class="wsh-tx">Nuoroda nebegalioja.</div>'; return; }
    if(data.off){ document.getElementById('wshCard').innerHTML = ''; return; }
    const k = JSON.stringify([data.brand, data.w, data.h]);
    // a wish put on the screen while it is open goes next (after the one shown has had its time), then the order goes on from it
    const ids = (data.wishes || []).map(w=>w.id);
    if(!WS.seen) WS.seen = new Set(ids);
    else ids.forEach(id=>{ if(!WS.seen.has(id)){ WS.seen.add(id); WS.queue.push(id); } });
    WS.d = data; if(k!==WS.key){ WS.key = k; await wishScreenLook(); }
  };
  await load(); setInterval(()=>{ if(document.visibilityState==='visible') load(); }, 2500);
  setInterval(wishScreenTick, 250); wishScreenTick();
}
async function wishStageLook(st, B, w, h){
  B = B || {}; const n = st._lk = (st._lk || 0) + 1;
  st.style.width = w+'px'; st.style.height = h+'px'; st.style.background = pollHex(B.bg, '#101010');
  st.style.setProperty('--wsh-c', pollHex(B.color, '#FFFFFF')); st.style.setProperty('--wsh-nc', pollHex(B.nameColor, '#F35E7D'));
  st.style.setProperty('--wsh-s', (+B.size||64)+'px'); st.style.setProperty('--wsh-ns', (+B.nameSize||36)+'px'); st.style.setProperty('--wsh-fade', (B.fade!=null ? +B.fade : 1)+'s');
  st.classList.toggle('left', B.align==='left'); st.style.setProperty('--wsh-sh', wishShadowCss(B.shadow));
  const nm = st.querySelector('.wsh-nm'); if(nm && st.classList.contains('wsh-pv')) nm.style.display = B.showName===false ? 'none' : '';
  const [f, bg, lg] = await Promise.all([pollFont({ font:B.font, gfont:B.gfont }), B.bgImg ? pollAsset(B.bgImg) : null, B.logo ? pollAsset(B.logo) : null]);
  if(st._lk!==n) return;   // a newer change is already being shown
  st.style.fontFamily = (f ? `"${f}", ` : '')+'Inter, Arial, sans-serif';
  st.querySelector('.wsh-bgimg').style.backgroundImage = bg ? `url("${pollCssUrl(bg.url)}")` : '';
  st.querySelector('.wsh-logo').innerHTML = lg ? `<img src="${esc(lg.url)}" alt="" style="height:${+B.logoH||160}px">` : '';
  st.querySelector('.wsh-logo').style.transform = (+B.logoX || +B.logoY) ? `translate(${+B.logoX||0}px, ${+B.logoY||0}px)` : '';
}
async function wishScreenLook(){
  const d = WS.d, st = document.getElementById('wshStage'); if(!st) return;
  await wishStageLook(st, d.brand || {}, d.w, d.h);
  wishFit();
}
function wishFit(){
  const st = document.getElementById('wshStage'), d = WS.d; if(!st || !d) return;
  const s = Math.min(window.innerWidth / d.w, window.innerHeight / d.h);
  st.style.transform = `scale(${s})`; st.parentNode.style.width = Math.round(d.w*s)+'px'; st.parentNode.style.height = Math.round(d.h*s)+'px';
}
function wishScreenTick(){
  const d = WS.d, card = document.getElementById('wshCard'); if(!d || !card) return;
  const list = d.wishes || [], B = d.brand || {};
  if(!list.length){ if(card.dataset.id){ card.classList.remove('on'); card.dataset.id = ''; } return; }
  if(WS.swapping) return;   // a fade is under way
  const sec = Math.max(2, +d.interval_sec || 10), now = Date.now(), fade = (B.fade!=null ? +B.fade : 1) * 1000;
  const cur = list.findIndex(w=>w.id===card.dataset.id);
  const show = next=>{
    if(card.dataset.id===next.id && card.classList.contains('on')){ WS.at = now; return; }
    WS.swapping = true; card.classList.remove('on');
    setTimeout(()=>{ card.dataset.id = next.id;
      card.innerHTML = `<div class="wsh-tx">${esc(next.text)}</div>${B.showName!==false && next.name ? `<div class="wsh-nm">— ${esc(next.name)}</div>` : ''}`;
      requestAnimationFrame(()=>card.classList.add('on')); WS.at = Date.now(); WS.swapping = false; }, card.dataset.id ? fade : 0);
  };
  // a wish held on the screen from the control page: shown (faded in) and kept until let go
  const pin = d.pinned ? list.find(w=>w.id===d.pinned) : null;
  if(pin){ WS.pinned = pin.id; show(pin); return; }
  // let go: at once, smoothly on to the next one, and the round goes on from there
  if(WS.pinned){ WS.pinned = null; show(list[(cur + 1) % list.length]); return; }
  // the wish shown stays its time; then the next one (a new one added goes next)
  if(cur >= 0 && now - WS.at < sec*1000) return;
  WS.queue = WS.queue.filter(id=>list.some(w=>w.id===id) && id!==card.dataset.id);
  const qi = WS.queue.length ? list.find(w=>w.id===WS.queue[0]) : null;
  if(qi) WS.queue.shift();
  if(cur >= 0 && list.length===1 && card.classList.contains('on')){ WS.at = now; return; }
  show(qi || list[(cur + 1) % list.length]);
}
const qs = new URLSearchParams(location.search), token = qs.get('balsuoti'), wish = qs.get('linketi'), screen = qs.get('linkejimai');
document.getElementById('guestView').classList.remove('hidden');
if(screen) renderWishScreen(screen); else if(wish) renderWishSubmit(wish); else if(token) renderPollVote(token); else document.getElementById('guestView').innerHTML = '<div class="poll-pub"><div class="poll-pub-in"><div class="poll-msg">Ši nuoroda nebegalioja.</div></div></div>';
</script>
</body>
