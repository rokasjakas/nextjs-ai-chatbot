// ---------- sign-in (Supabase Auth, without the library) ----------
var AUTH = null;
try{ AUTH = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){ AUTH = null; }
function authSave(j){ AUTH = { token:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in || 3600)*1000, email:(j.user && j.user.email) || (AUTH && AUTH.email) || '', id:(j.user && j.user.id) || (AUTH && AUTH.id) || '' }; try{ localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)); }catch(e){} }
function xhr(method, url, body, headers, cb){
  var x = new XMLHttpRequest(); x.open(method, url, true); x.timeout = 20000;
  x.setRequestHeader('apikey', SUPABASE_KEY);
  for(var k in headers) if(headers.hasOwnProperty(k)) x.setRequestHeader(k, headers[k]);
  if(body!=null) x.setRequestHeader('Content-Type', 'application/json');
  x.onload = function(){ var j = null; try{ j = x.responseText ? JSON.parse(x.responseText) : null; }catch(e){} cb(x.status, j, x.responseText); };
  x.onerror = function(){ cb(0, null, 'Nėra ryšio'); };
  x.ontimeout = function(){ cb(0, null, 'Serveris neatsako'); };
  x.send(body!=null ? JSON.stringify(body) : null);
}
function signIn(email, pass, cb){
  xhr('POST', SUPABASE_URL+'/auth/v1/token?grant_type=password', { email:email, password:pass }, {}, function(st, j){
    if(st===200 && j && j.access_token){ authSave(j); cb(null); } else cb((j && (j.error_description || j.msg || j.message)) || 'Nepavyko prisijungti ('+st+')');
  });
}
function refresh(cb){
  if(!AUTH || !AUTH.refresh){ cb('no'); return; }
  xhr('POST', SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', { refresh_token:AUTH.refresh }, {}, function(st, j){
    if(st===200 && j && j.access_token){ authSave(j); cb(null); } else cb('expired');
  });
}
// the database (PostgREST): a fresh sign-in is taken when the old one ran out
function api(method, path, body, cb, prefer){
  function go(again){
    var h = { Authorization:'Bearer '+(AUTH ? AUTH.token : SUPABASE_KEY) }; if(prefer) h.Prefer = prefer;
    xhr(method, SUPABASE_URL+'/rest/v1/'+path, body, h, function(st, j, t){

      if(st>=200 && st<300) cb(null, j); else cb((j && (j.message || j.error)) || t || ('Klaida '+st), j);
    });
  }
  if(AUTH && AUTH.exp < Date.now() + 60000) refresh(function(e){ if(e){ signOut(); return; } go(false); }); else go(false);

var D = { items:[], byId:{}, groups:{}, tags:{}, canEdit:false, me:null, loaded:false };

  var left = 5, err = '';

    var role = D.me ? D.me.role : '';

  xhr('GET', 'rfid-items.json?v='+Date.now(), null, {}, function(st, j){ if(st===200 && j){ base = j; D.groups = j.groups || {}; } else err = err || 'Nepavyko įkelti įrangos sąrašo'; build(); done(); });
  api('GET', 'app_state?select=key,data&key=in.(itemOverrides,customItems)', null, function(e, rows){
    (rows || []).forEach(function(r){ if(r.key==='itemOverrides') ov = r.data || {}; if(r.key==='customItems') custom = r.data || []; }); build(); done(e); });
  var tagCols = 'epc,item_id,item_name,unit,note,created_by_name,created_at';
  var tagsGet = function(cols, again){ api('GET', 'rfid_tags?select='+cols+'&limit=20000', null, function(e, rows){
    if(e && !again && /code/.test(e)){ tagsGet(tagCols, true); return; }
    D.tags = {}; (rows || []).forEach(function(r){ D.tags[r.epc] = r; });
    done(e && /does not exist|schema cache/i.test(e) ? 'RFID lentelių dar nėra – Supabase paleisk supabase/sql/rfid.sql' : e); }); };
  tagsGet(tagCols+',code', false);

  api('GET', 'role_permissions?select=role,section,can_edit&section=eq.inventory', null, function(e, rows){ perms = rows || []; done(); });
  var built = 0;
  function build(){
    if(++built < 2 || !base) return;
    var map = {}, out = [];
    base.items.forEach(function(it){ var o = ov[it.id] || {}, m = {}; for(var k in it) m[k] = it[k]; for(var k2 in o) if(o.hasOwnProperty(k2)) m[k2] = o[k2]; m.id = String(it.id); out.push(m); });
    (custom || []).forEach(function(it){ if(!it || it.id==null) return; var m = {}; for(var k in it) m[k] = it[k]; m.id = String(it.id); out.push(m); });
    out.forEach(function(m){ m.group = GROUP_LEGACY[m.group] || m.group || 'kita'; m._s = norm([m.name, m.code, m.folder].join(' ')); map[m.id] = m; });

function tagsOf(id){ var out = []; for(var e in D.tags) if(D.tags.hasOwnProperty(e) && String(D.tags[e].item_id)===String(id)) out.push(D.tags[e]); return out; }

    $('out').onclick = function(){ if(confirm('Atsijungti?')) signOut(); };
    var bs = document.querySelectorAll('[data-t]');
    for(var i=0;i<bs.length;i++) bs[i].onclick = function(){ V.tab = this.getAttribute('data-t'); V.last = null; draw(); };
    $('dbgT').onclick = function(e){ e.preventDefault(); DBG.on = !DBG.on; dbgDraw(); };
    installBind();
    scanInit();
  }
  $('who').textContent = who;
  var bs2 = document.querySelectorAll('[data-t]');
  for(var j=0;j<bs2.length;j++) bs2[j].className = bs2[j].getAttribute('data-t')===V.tab ? 'on' : '';
  if(V.tab==='assign') drawAssign(); else if(V.tab==='inv') drawInv(); else drawFind();
}
// ---------- the scan field: the scanner's Keyboard Emulator types the tag and Enter into it ----------
// works however the scanner sends it: text into the field (input), key presses, or – when the field
// is not in focus – key presses to the page; Enter (or a short pause) ends one tag
var SCAN = { fn:null, buf:'', gbuf:'', t:0, gt:0, first:0, got:0 };
// the usual tag length: the most common among the tags already given (24 signs = 96-bit EPC, if none yet)
function epcLen(){
  var c = {}, best = 24, n = 0;
  for(var e in D.tags) if(D.tags.hasOwnProperty(e)){ var l = e.length; c[l] = (c[l] || 0) + 1; if(c[l] > n && l >= 8){ n = c[l]; best = l; } }
  return best;
}
// scanner trigger keys (Chainway: F9 = 120 and others, depending on the model and settings)
var TRIGGER = { 120:1, 121:1, 122:1, 123:1, 139:1, 280:1, 293:1, 294:1 };
function scanNudge(){
  var el = $('scan'); if(!el) return;
  scanFocus();
  var st = $('scanSt'); if(st){ st.className = 'sst bad nudge'; st.innerHTML = ic('err')+' Laukelis neaktyvus – PASPAUSK PIRŠTU mėlyną laukelį ir skenuok dar kartą'; }
  var box = $('scanbox'); if(box){ box.className = 'card nudge'; setTimeout(function(){ if(box.className==='card nudge') box.className = 'card'; }, 1600); }
  beep(false);
}
// the on-screen keyboard stays hidden: the scanner types the tag itself (button – show it to type by hand)
var KB = false; try{ KB = localStorage.getItem('es-rfid-kb')==='1'; }catch(e){}
function scanFocus(){
  var el = $('scan'); if(!el) return;
  // old Android: a field focused while read-only does not open the keyboard; writing is allowed again right after
  if(!KB && document.activeElement!==el){ el.readOnly = true; setTimeout(function(){ el.readOnly = false; }, 100); }
  try{ el.focus(); }catch(e){}
}
function kbApply(){
  var el = $('scan'), b = $('kbT'); if(!el) return;
  if(KB) el.removeAttribute('inputmode'); else el.setAttribute('inputmode', 'none');
  if(b){ b.className = 'btn ghost sm kbt'+(KB ? ' on' : ''); b.title = KB ? 'Slėpti klaviatūrą' : 'Rodyti klaviatūrą (įvesti ranka)'; }
}
var DBG = { on:false, log:[] };
function dbg(m){ DBG.log.unshift(new Date().toTimeString().slice(0,8)+'  '+m); if(DBG.log.length > 14) DBG.log.length = 14; if(DBG.on) dbgDraw(); }
function dbgDraw(){ var d = $('dbg'); if(!d) return; d.className = DBG.on ? 'card dbg' : 'card dbg hidden';
  d.innerHTML = '<b>Ką gauna puslapis</b> <small class="muted">(nuskaityk žymą ir pažiūrėk)</small><br>'+(DBG.log.map(esc).join('<br>') || '<span class="muted">dar nieko</span>'); }
function scanTake(v, how){
  clearTimeout(SCAN.t); SCAN.buf = ''; SCAN.gbuf = ''; SCAN.first = 0;
  // continuous reading can bring several tags at once: split by new lines / commas, or by the usual tag length
  // (spaces inside are part of one tag – some scanners write the EPC in groups)
  var parts = String(v||'').split(/[\r\n\t,;]+/), list = [];
  for(var i=0;i<parts.length;i++){ var e = epcOf(parts[i]); if(!e) continue;
    var L = epcLen();
    if(e.length > L && e.length % L === 0 && /^[0-9A-F]+$/.test(e)){ for(var j=0;j<e.length;j+=L) list.push(e.slice(j, j+L)); } else list.push(e); }
  dbg('žyma ('+how+'): "'+String(v).slice(0,40)+'" → '+(list.join(', ') || 'tuščia'));
  for(var k=0;k<list.length;k++) if(list[k].length >= 4 && SCAN.fn) SCAN.fn(list[k]);
}
function scanState(){
  var el = $('scan'), st = $('scanSt'); if(!el || !st) return;
  var on = document.activeElement===el;
  st.className = 'sst '+(on ? 'ok' : 'bad');
  st.innerHTML = on ? ic('ok')+' Pasiruošęs – spausk skaitytuvo mygtuką' : ic('err')+' Paspausk mėlyną laukelį, tada skenuok';
}
function scanInit(){
  var el = $('scan');
  el.onkeydown = function(e){
    dbg('keydown '+e.keyCode+(e.key ? ' "'+e.key+'"' : '')+(TRIGGER[e.keyCode] ? ' (skaitytuvo mygtukas)' : ''));
    if(e.keyCode===13 || e.keyCode===9){ e.preventDefault(); var kb = SCAN.buf.length > el.value.length; scanTake(kb ? SCAN.buf : el.value, kb ? 'klavišai' : 'laukelis'); el.value = ''; }
  };
  el.onkeypress = function(e){ var c = e.charCode || e.which; if(c > 32){ SCAN.buf += String.fromCharCode(c); } };
  // continuous reading: the scanner may type tag after tag without Enter and without a pause –
  // whole tags are taken out of the field while it is still typing
  el.oninput = function(){
    var v = el.value; SCAN.got++;
    dbg('input: '+v.length+' simb. „…'+v.slice(-26)+'“');
    clearTimeout(SCAN.t);
    if(/[\r\n\t,;]/.test(v)){ var cut = v.search(/[^\r\n\t,;]*$/); el.value = v.slice(cut); scanTake(v.slice(0, cut), 'skirtukas'); v = el.value; }
    var L = epcLen(), h = epcOf(v), hex = /^[0-9A-F]+$/.test(h);
    if(hex && h.length >= 2*L && h.length % L === 0){ el.value = ''; SCAN.first = 0; scanTake(h, 'srautas'); return; }
    if(!el.value){ SCAN.first = 0; return; }
    if(!SCAN.first) SCAN.first = Date.now();
    // typing for over a second without a break: take the whole tags so far, keep the unfinished end
    if(hex && Date.now() - SCAN.first > 1000 && h.length >= L){ var n = h.length - h.length % L; el.value = h.slice(n); SCAN.first = el.value ? Date.now() : 0; scanTake(h.slice(0, n), 'srautas'); if(!el.value) return; }
    SCAN.t = setTimeout(function(){ SCAN.first = 0; if(el.value){ var w = el.value; el.value = ''; scanTake(w, 'pauzė'); } }, 400);
  };
  el.onfocus = el.onblur = function(e){ dbg(e.type==='focus' ? 'laukelis aktyvus' : 'laukelis neaktyvus'); scanState(); };
  // the field is not in focus: key presses to the page are collected too
  document.addEventListener('keydown', function(e){
    var t = e.target; if(t===el || (t && /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
    dbg('puslapis keydown '+e.keyCode+(TRIGGER[e.keyCode] ? ' (skaitytuvo mygtukas)' : ''));
    if(!SCAN.fn) return;
    // the scanner's trigger pressed while the field is not active: the emulator has nowhere to write the tag
    if(TRIGGER[e.keyCode]){ scanNudge(); return; }
    if(e.keyCode===13 || e.keyCode===9){ if(SCAN.gbuf){ e.preventDefault(); scanTake(SCAN.gbuf, 'puslapis'); } return; }
    var k = e.keyCode, ch = k>=48 && k<=57 ? String.fromCharCode(k) : k>=96 && k<=105 ? String(k-96) : k>=65 && k<=90 ? String.fromCharCode(k) : '';
    if(ch){ SCAN.gbuf += ch; clearTimeout(SCAN.gt); SCAN.gt = setTimeout(function(){ if(SCAN.gbuf.length >= 8) scanTake(SCAN.gbuf, 'puslapis, pauzė'); SCAN.gbuf = ''; }, 500); }
  }, true);
  // tapping the field: read-only for a moment, so it gets focus without the keyboard
  var hold = function(){ if(!KB && document.activeElement!==el){ el.readOnly = true; setTimeout(function(){ el.readOnly = false; }, 200); } };
  el.addEventListener('touchstart', hold, false); el.addEventListener('mousedown', hold, false);
  $('kbT').onclick = function(e){ e.stopPropagation(); KB = !KB; try{ localStorage.setItem('es-rfid-kb', KB ? '1' : '0'); }catch(x){} kbApply(); el.blur(); setTimeout(function(){ if(KB) el.focus(); else scanFocus(); }, 50); };
  kbApply();
  document.body.onclick = function(e){ var t = e.target; if(!SCAN.fn || (t && /INPUT|SELECT|TEXTAREA|BUTTON|A/.test(t.tagName)) || (t && t.closest && t.closest('button'))) return; scanFocus(); };
  setTimeout(function(){ scanFocus(); scanState(); }, 60);
}
// which tab uses the field (null – hidden, e.g. while choosing a thing)
function setScan(label, hint, fn){
  SCAN.fn = fn; var box = $('scanbox'); if(!box) return;
  box.className = fn ? 'card' : 'card hidden';
  $('scanL').textContent = label || 'Nuskaityk žymą'; $('scanH').textContent = hint || '';
  if(fn) setTimeout(function(){ var el = $('scan'); if(el && document.activeElement!==el && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) scanFocus(); scanState(); }, 60);
}

// Paieška: a tag scanned – what it is; or (Nepertraukiamai) everything scanned in a row
var CONT_KEY = 'es-rfid-cont';
try{ V.cont = localStorage.getItem(CONT_KEY)==='1'; }catch(e){}
V.seen = {}; V.seenN = 0;
var FIND_T = 0;
function findLater(){ clearTimeout(FIND_T); FIND_T = setTimeout(function(){ if(V.tab==='find') drawFind(); }, 150); }
function tagLine(epc, n){
  var t = D.tags[epc];
  return '<div class="row"><div class="t">'+(t ? '<b>'+codeHtml(t)+(t.unit ? 'Vnt. '+esc(t.unit) : 'Be numerio')+'</b>' : '<b class="warn">Nežinoma žyma</b>')+'<small>'+esc(epc)+'</small></div>'+(n > 1 ? '<span class="n muted">×'+n+'</span>' : '')+'</div>';
}
// reading many tags with one press is a setting of the scanner itself (Keyboard Emulator), not of this page
function contHelp(open){
  return '<details class="help"'+(open ? ' open' : '')+'><summary>Skaito tik po vieną žymą? Įjunk nepertraukiamą skaitymą</summary><ol>'
    + '<li>Atidaryk programą <b>Keyboard Emulator</b> (Keyboardemulator).</li>'
    + '<li>Nustatymuose (<b>Settings</b> / <b>Function</b>) pažymėk <b>UHF</b> (RFID).</li>'
    + '<li>Įjunk <b>Continuous scan</b> (gali vadintis <b>Continuous</b>, <b>Continuous mode</b>, <b>Loop</b>). Jei yra <b>Interval</b> – 100–300 ms.</li>'
    + '<li><b>Process mode</b> / <b>Output mode</b> – <b>Keyboard</b> (klaviatūra, NE „Broadcast“), <b>End mark</b> / <b>Suffix</b> – <b>Enter</b>.</li>'
    + '<li><b>Power</b> / <b>Output power</b> – didesnė (pvz. 25–30), kad skaitytų toliau ir daugiau žymų.</li>'
    + '<li>Išsaugok, grįžk čia ir <b>laikyk</b> skaitytuvo mygtuką – žymos plauks be perstojo (kai kuriose versijose: paspausk – pradeda, paspausk dar kartą – sustoja).</li>'
    + '</ol><p class="muted">Ta pati žyma skaičiuojama tik kartą, todėl nesvarbu, kiek kartų skaitytuvas ją nuskaito.</p></details>';
}
function drawFind(){
  var html = '<div class="tabs sub"><button data-m="one" class="'+(V.cont ? '' : 'on')+'">Po vieną</button><button data-m="cont" class="'+(V.cont ? 'on' : '')+'">Nepertraukiamai</button></div>';
  if(!V.cont){
    var L = V.last;
    if(L){ var t = D.tags[L];
      html += t ? '<div class="flash ok">'+ic('ok')+' '+esc(itemName(t.item_id, t.item_name))+'</div><div class="card"><div class="big">'+esc(itemName(t.item_id, t.item_name))+'</div>'
          + '<div class="muted">'+codeHtml(t)+esc(groupName((D.byId[String(t.item_id)]||{}).group))+(t.unit ? ' · vienetas <b>'+esc(t.unit)+'</b>' : '')+'</div>'
          + (t.note ? '<p>'+esc(t.note)+'</p>' : '')
          + '<div class="muted">Žyma '+esc(L)+' · priskyrė '+esc(t.created_by_name||'')+' '+esc(when(t.created_at))+'</div>'
          + '<div class="muted">Šiam daiktui priskirta žymų: '+tagsOf(t.item_id).length+(D.byId[String(t.item_id)] && D.byId[String(t.item_id)].qty ? ' (sandėlyje '+D.byId[String(t.item_id)].qty+' vnt.)' : '')+'</div></div>'
        : '<div class="flash warn">'+ic('err')+' Nežinoma žyma</div><div class="card"><div class="muted">'+esc(L)+'</div>'+(D.canEdit ? '<button class="btn wide" id="fAssign">'+ic('tag')+' Priskirti šią žymą daiktui</button>' : '<p class="muted">Priskirti gali tie, kas redaguoja „Įrangą“.</p>')+'</div>';
    }
  } else {
    var per = {}, unknown = [], total = 0;
    for(var e in V.seen) if(V.seen.hasOwnProperty(e)){ total++; var tg = D.tags[e]; if(tg){ var k = String(tg.item_id); (per[k] = per[k] || []).push(e); } else unknown.push(e); }
    var ids = Object.keys(per).sort(function(a,b){ return itemName(a).localeCompare(itemName(b)); });
    var lastE = V.seenLast, lt = lastE ? D.tags[lastE] : null;
    html += '<div class="card"><div class="row" style="border-top:0;padding-top:0;"><div class="t"><b>Nuskenuota: '+total+' žym.</b><small>'+ids.length+' daikt.'+(unknown.length ? ' · nežinomų '+unknown.length : '')+'</small></div><button class="btn ghost sm" id="clr">Išvalyti</button></div>'
      + (lastE ? (lt ? '<div class="flash ok">'+ic('ok')+' '+codeHtml(lt)+esc(itemName(lt.item_id, lt.item_name))+'</div>' : '<div class="flash warn">'+ic('err')+' Nežinoma: '+esc(lastE)+'</div>') : '<p class="muted">Laikyk skaitytuvo mygtuką – čia atsiras visos nuskaitytos žymos.</p>')+contHelp(total < 2)+'</div>'
      + ids.map(function(id){ var it = D.byId[id] || {}, list = per[id], all = tagsOf(id).length;
          return '<div class="card"><div class="row" style="border-top:0;padding-top:0;"><div class="t"><b>'+esc(itemName(id, D.tags[list[0]].item_name))+'</b><small>'+esc(groupName(it.group))+(it.qty ? ' · sandėlyje '+it.qty+' vnt.' : '')+'</small></div><span class="n '+(list.length>=all ? 'ok' : 'warn')+'">'+list.length+' / '+all+'</span></div>'
            + '<div class="list">'+list.sort(function(a,b){ return String(D.tags[a].code||D.tags[a].unit).localeCompare(String(D.tags[b].code||D.tags[b].unit), undefined, { numeric:true }); }).map(function(x){ return tagLine(x, V.seen[x]); }).join('')+'</div></div>'; }).join('')
      + (unknown.length ? '<div class="card"><b class="warn">Nežinomos žymos ('+unknown.length+')</b><div class="list">'+unknown.map(function(x){ return tagLine(x, V.seen[x]); }).join('')+'</div></div>' : '');
  }
  $('body').innerHTML = html;
  var ms = document.querySelectorAll('[data-m]');
  for(var i=0;i<ms.length;i++) ms[i].onclick = function(){ V.cont = this.getAttribute('data-m')==='cont'; try{ localStorage.setItem(CONT_KEY, V.cont ? '1' : '0'); }catch(x){} drawFind(); };
  if(V.cont){
    $('clr').onclick = function(){ V.seen = {}; V.seenLast = null; drawFind(); };
    setScan('Nepertraukiamas skenavimas', 'Laikyk skaitytuvo mygtuką – rodoma viskas, kas nuskaityta (ta pati žyma – vieną kartą). Jei skaito tik po vieną: Keyboard Emulator nustatymuose įjunk nepertraukiamą skaitymą (Continuous).',
      function(epc){ if(V.seen[epc]){ V.seen[epc]++; return; } V.seen[epc] = 1; V.seenLast = epc; beep(!!D.tags[epc]); findLater(); });
  } else {
    setScan('Nuskaityk žymą', 'Paspausk skaitytuvo mygtuką – parodysiu, kuris tai daiktas.', function(epc){ V.last = epc; beep(!!D.tags[epc]); drawFind(); });
  }
  var fa = $('fAssign'); if(fa) fa.onclick = function(){ V.tab = 'assign'; V.pending = V.last; draw(); };
}

// Priskirti: choose a thing, then every scanned tag is written to it (one after another)
var ASQ = { busy:false, list:[], lastSame:null };
function drawAssign(){
  if(!D.canEdit){ $('body').innerHTML = '<div class="card muted">Priskirti žymas gali tie, kas redaguoja „Įrangą“.</div>'; return; }
  var it = V.item ? D.byId[V.item] : null;
  if(!it){
    $('body').innerHTML = '<div class="card">'+(V.pending ? '<div class="flash warn">Žyma '+esc(V.pending)+' bus priskirta pasirinktam daiktui</div>' : '')
      + '<label for="q">Kuriam daiktui priskirti?</label><input type="search" id="q" placeholder="Ieškoti: pavadinimas, kodas…" autocomplete="off"><div class="list" id="res"></div></div>';
    var q = $('q'), res = $('res');
    var show = function(){ var w = norm(q.value).split(/\s+/).filter(Boolean), n = 0, h = '';
      for(var i=0;i<D.items.length && n<60;i++){ var x = D.items[i], okk = true; for(var k=0;k<w.length;k++) if(x._s.indexOf(w[k])<0){ okk = false; break; }
        if(!okk) continue; n++; var c = tagsOf(x.id).length;
        h += '<button class="pick" data-id="'+esc(x.id)+'"><b>'+esc(x.name)+'</b><br><small>'+esc(groupName(x.group))+(x.code ? ' · kodas '+esc(x.code) : '')+(x.qty ? ' · '+x.qty+' vnt.' : '')+(c ? ' · žymų '+c : '')+'</small></button>'; }
      res.innerHTML = h || '<p class="muted">Nieko nerasta.</p>';
      var ps = res.querySelectorAll('[data-id]'); for(var j=0;j<ps.length;j++) ps[j].onclick = function(){ V.item = this.getAttribute('data-id'); V.unit = String(tagsOf(V.item).length + 1); drawAssign(); }; };
    q.oninput = show; show(); setScan(null);
    return;
  }
  var tags = tagsOf(it.id).sort(function(a,b){ return String(a.unit).localeCompare(String(b.unit), undefined, { numeric:true }); });
  $('body').innerHTML = '<div class="card"><div class="row"><div class="t"><b>'+esc(it.name)+'</b><small>'+esc(groupName(it.group))+(it.qty ? ' · sandėlyje '+it.qty+' vnt.' : '')+'</small></div><button class="btn ghost sm" id="chg">Keisti</button></div></div>'
    + '<div class="card"><label for="unit">Vieneto nr. (nebūtina)</label><input type="text" id="unit" value="'+esc(V.unit)+'" autocomplete="off">'
    + '<label><input type="checkbox" id="auto" '+(V.autoUnit ? 'checked' : '')+'> po kiekvienos žymos – kitas numeris</label>'
    + '<div id="msg"></div></div>'
    + '<div class="card"><b>Priskirtos žymos ('+tags.length+')</b><div class="list">'+(tags.map(function(t){ return '<div class="row"><div class="t"><b>'+codeHtml(t)+(t.unit ? 'Vnt. '+esc(t.unit) : 'Be numerio')+'</b><small>'+esc(t.epc)+' · '+esc(when(t.created_at))+'</small></div><button class="x" data-del="'+esc(t.epc)+'" aria-label="Pašalinti">'+ic('close')+'</button></div>'; }).join('') || '<p class="muted">Dar nėra.</p>')+'</div></div>';
  $('chg').onclick = function(){ V.item = null; drawAssign(); };
  $('unit').onchange = function(){ V.unit = this.value.trim(); };
  $('auto').onchange = function(){ V.autoUnit = this.checked; };
  var dels = document.querySelectorAll('[data-del]');
  for(var i=0;i<dels.length;i++) dels[i].onclick = function(){ var e = this.getAttribute('data-del'); if(!confirm('Pašalinti žymą '+e+' nuo šio daikto?')) return;
    api('DELETE', 'rfid_tags?epc=eq.'+encodeURIComponent(e), null, function(er){ if(er){ alert('Nepavyko: '+er); return; } delete D.tags[e]; drawAssign(); }); };
  var assign = function(epc){
    if(ASQ.busy){ if(ASQ.list.indexOf(epc)<0) ASQ.list.push(epc); return; }
    var old = D.tags[epc], msg = $('msg');
    if(old && String(old.item_id)===String(it.id)){ if(ASQ.lastSame===epc) return next(); ASQ.lastSame = epc; beep(false); msg.innerHTML = '<div class="flash warn">Ši žyma jau priskirta šiam daiktui'+(old.unit ? ' (vnt. '+esc(old.unit)+')' : '')+'</div>'; return next(); }
    if(old && !confirm('Žyma jau priskirta: '+itemName(old.item_id, old.item_name)+(old.unit ? ' (vnt. '+old.unit+')' : '')+'. Perkelti šiam daiktui?')) return next();
    ASQ.busy = true;
    var row = { epc:epc, item_id:String(it.id), item_name:it.name, unit:V.unit || '', note:'' };
    api('POST', 'rfid_tags?on_conflict=epc', [row], function(er, rows){
      ASQ.busy = false;
      if(er){ beep(false); msg.innerHTML = '<div class="flash bad">Nepavyko: '+esc(er)+'</div>'; return next(); }
      var nr = D.tags[epc] = rows && rows[0] || row; beep(true);
      if(V.autoUnit && /^\d+$/.test(V.unit)) V.unit = String(+V.unit + 1);
      V.pending = null; if(V.tab!=='assign' || V.item!==String(it.id)){ ASQ.list = []; return; }
      drawAssign(); $('msg').innerHTML = '<div class="flash ok">'+ic('ok')+' Priskirta: '+codeHtml(nr)+esc(epc)+(nr.unit ? ' · vnt. '+esc(nr.unit) : '')+'</div>';
      next();
    }, 'resolution=merge-duplicates,return=representation');
  };
  var next = function(){ if(ASQ.list.length) assign(ASQ.list.shift()); };
  setScan('Skenuok žymas – kiekviena priskiriama šiam daiktui', it.name, assign);
  if(V.pending){ var p = V.pending; V.pending = null; assign(p); }
}

// Inventorizacija: walk with the trigger held – every tag counted once, then compared with the warehouse
var INV_T = 0;
function invSave(){ try{ localStorage.setItem(INV_KEY, JSON.stringify(V.inv)); }catch(e){} }
function drawInv(){
  if(!V.inv){
    $('body').innerHTML = '<div class="card"><label for="ttl">Pavadinimas (nebūtina)</label><input type="text" id="ttl" placeholder="pvz. Sandėlis, A lentyna"><button class="btn wide" id="go">'+ic('list')+' Pradėti skenavimą</button></div><div class="card"><b>Ankstesni</b><div id="hist" class="muted">Kraunama…</div></div>';
    $('go').onclick = function(){ V.inv = { title:$('ttl').value.trim(), started:new Date().toISOString(), tags:{} }; invSave(); drawInv(); };
    setScan(null);
    api('GET', 'rfid_inventories?select=id,title,created_by_name,created_at,finished_at,tags&order=created_at.desc&limit=15', null, function(e, rows){
      var h = $('hist'); if(!h) return;
      if(e){ h.textContent = e; return; }
      h.innerHTML = (rows||[]).map(function(r){ return '<div class="row"><div class="t"><b>'+esc(r.title || 'Inventorizacija')+'</b><small>'+esc(r.created_by_name||'')+' · '+esc(when(r.finished_at || r.created_at))+'</small></div><span class="n">'+((r.tags||[]).length)+' žym.</span></div>'; }).join('') || 'Dar nėra.';
    });
    return;
  }
  var I = V.inv, per = {}, unknown = [], total = 0;
  for(var e in I.tags) if(I.tags.hasOwnProperty(e)){ total++; var t = D.tags[e]; if(t){ var k = String(t.item_id); (per[k] = per[k] || []).push(t); } else unknown.push(e); }
  var ids = Object.keys(per).sort(function(a,b){ return itemName(a).localeCompare(itemName(b)); });
  $('body').innerHTML = '<div class="card"><div class="row"><div class="t"><b>'+esc(I.title || 'Inventorizacija')+'</b><small>pradėta '+esc(when(I.started))+'</small></div><span class="big">'+total+'</span></div>'
    + contHelp(total < 2) + '<button class="btn wide" id="fin">'+ic('ok')+' Baigti ir išsaugoti</button><button class="btn ghost wide" id="drop">Atšaukti</button></div>'
    + '<div class="card"><b>Rasta pagal daiktus</b><div class="list" id="per">'+(ids.map(function(id){ var it = D.byId[id] || {}, n = per[id].length, q = it.qty;
        return '<div class="row"><div class="t"><b>'+esc(itemName(id, per[id][0].item_name))+'</b><small>'+esc(groupName(it.group))+(q ? ' · sandėlyje '+q+' vnt. · žymų priskirta '+tagsOf(id).length : '')+'</small></div><span class="n '+(q && n>=tagsOf(id).length ? 'ok' : 'warn')+'">'+n+(tagsOf(id).length ? ' / '+tagsOf(id).length : '')+'</span></div>'; }).join('') || '<p class="muted">Dar nieko.</p>')+'</div></div>'
    + (unknown.length ? '<div class="card"><b class="warn">Nežinomos žymos ('+unknown.length+')</b><div class="muted">'+unknown.slice(0, 50).map(esc).join('<br>')+'</div></div>' : '');
  setScan('Inventorizacija – skenuok', 'Laikyk skaitytuvo mygtuką ir eik pro daiktus – skaitytuvas turi būti nepertraukiamo skaitymo režime (žr. žemiau). Ta pati žyma skaičiuojama vieną kartą.', function(epc){ if(!I.tags[epc]){ I.tags[epc] = new Date().toISOString(); invSave(); beep(!!D.tags[epc]); clearTimeout(INV_T); INV_T = setTimeout(function(){ if(V.tab==='inv' && V.inv===I) drawInv(); }, 150); } });
  $('drop').onclick = function(){ if(!confirm('Atšaukti šį skenavimą? Nuskaitytos žymos nebus išsaugotos.')) return; V.inv = null; invSave(); drawInv(); };
  $('fin').onclick = function(){ var b = this; b.disabled = true; b.textContent = 'Saugoma…';
    var tags = []; for(var e in I.tags) if(I.tags.hasOwnProperty(e)) tags.push({ epc:e, at:I.tags[e] });
    api('POST', 'rfid_inventories', [{ title:I.title, tags:tags, finished_at:new Date().toISOString() }], function(er){
      if(er){ b.disabled = false; b.textContent = 'Baigti ir išsaugoti'; alert('Nepavyko išsaugoti: '+er+' (skenavimas liko telefone – bandyk dar kartą)'); return; }
      V.inv = null; invSave(); alert('Išsaugota: '+tags.length+' žym.'); drawInv(); }, 'return=minimal'); };
}

if(AUTH && AUTH.token) start(); else drawLogin();
</script>
</body>
</html>
