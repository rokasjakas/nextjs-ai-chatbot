project_id = "yakmikxkcudwloxruhvx"

[functions.rentman-project]
# Require a valid Supabase JWT (anon or user key) in the Authorization header.
verify_jwt = true

[functions.rentman-sync]
# Require a valid Supabase JWT (anon or user key) in the Authorization header.
verify_jwt = true

[functions.vehicle-reminders]
# Called by pg_cron (x-cron-secret header) and by signed-in team members
# (their Supabase session token); both are checked inside the function.
verify_jwt = false

[functions.user-access]
# Called right after sign-up (no session yet) and by administrators; the
# function checks both cases itself.
verify_jwt = false

[functions.push-notify]
# GET returns the public key; POST checks the user's session itself.
verify_jwt = false

[functions.mail]
# checks the user's session itself
verify_jwt = false

[functions.invoice-respond]
# Opened from the invoice e-mail by people without an account: the token in
# the letter is checked inside the function.
verify_jwt = false

[functions.mail-in]
# Called by the Cloudflare Email Worker with the MAIL_IN_SECRET header (checked inside).
verify_jwt = false

[functions.freelance-portal]
# saskaitos.eventsolutions.lt: freelancers have no app account; the one-time PIN session is checked inside the function.
verify_jwt = false

[functions.guest]
# Guests have no login: the guest token is checked inside.
verify_jwt = false

[functions.meet]
# Google's redirect carries no token: checked inside.
verify_jwt = false

[functions.booking-reminders]
# Hourly from pg_cron with the CRON_SECRET header; „Siųsti dabar“ checks the user's token itself.
verify_jwt = false

[functions.files]
# Checks the user's session itself (auth/v1/user).
verify_jwt = false

[functions.uta-pin]
# „Kuro kortelė“ from the event letter: drivers have no account; the link's token is checked inside.
verify_jwt = false

[functions.reports-mail]
# Admins (their session token, checked inside) and push-notify's cron (x-cron-secret header).
verify_jwt = false
